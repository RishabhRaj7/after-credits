n New York City.","episodes":39},{"id":"show-62104","type":"show","title":"The Seven Deadly Sins","year":2014,"addedAt":"2017-12-16","releaseDate":"2014-10-05","poster":"posters/show-62104.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"The “Seven Deadly Sins”—a group of evil knights who conspired to overthrow the kingdom of Britannia—were said to have been eradicated by the Holy Knights, although some claim that they still live. Ten years later, the Holy Knights have staged a Coup d'état and assassinated the king, becoming the new, tyrannical rulers of the kingdom. Elizabeth, the king's only daughter, sets out on a journey to find the “Seven Deadly Sins,” and to enlist their help in taking back the kingdom.","episodeRuntime":24,"episodes":96},{"id":"show-61889","type":"show","title":"Marvel's Daredevil","year":2015,"addedAt":"2017-12-16","releaseDate":"2015-04-10","poster":"posters/show-61889.jpg","genres":["Crime","Drama","Action & Adventure"],"overview":"Lawyer-by-day Matt Murdock uses his heightened senses from being blinded as a young boy to fight crime at night on the streets of Hell’s Kitchen as Daredevil.","episodes":39},{"id":"show-61374","type":"show","title":"Tokyo Ghoul","year":2014,"addedAt":"2017-12-16","releaseDate":"2014-07-04","poster":"posters/show-61374.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy"],"overview":"Ken Kaneki, a bookworm college student, meets Rize, a girl his own age with whom he shares many interests.","episodeRuntime":24,"episodes":48},{"id":"show-60735","type":"show","title":"The Flash (2014)","year":2014,"addedAt":"2017-12-16","releaseDate":"2014-10-07","poster":"posters/show-60735.jpg","genres":["Drama","Sci-Fi & Fantasy"],"overview":"After being struck by lightning, CSI investigator Barry Allen awakens from a nine-month coma to discover he has been  granted the gift of super speed.  Teaming up with S.T.A.R. Labs, Barry takes on the persona of The Flash, the Fastest  Man Alive, to protect ng crime in 21st century London.","episodeRuntime":90,"episodes":12},{"id":"show-63639","type":"show","title":"The Expanse","year":2015,"addedAt":"2017-12-18","releaseDate":"2015-12-14","poster":"posters/show-63639.jpg","genres":["Drama","Mystery","Sci-Fi & Fantasy"],"overview":"A thriller set two hundred years in the future following the case of a missing young woman who brings a hardened detective and a rogue ship's captain together in a race across the solar system to expose the greatest conspiracy in human history.","episodes":62},{"id":"show-67195","type":"show","title":"Legion","year":2017,"addedAt":"2017-12-18","releaseDate":"2017-02-08","poster":"posters/show-67195.jpg","genres":["Action & Adventure","Sci-Fi & Fantasy","Drama"],"overview":"David Haller, AKA Legion, is a troubled young man who may be more than human. Diagnosed as schizophrenic, David has been in and out of psychiatric hospitals for years. But after a strange encounter with a fellow patient, he’s confronted with the possibility that the voices he hears and the visions he sees might be real.","episodeRuntime":50,"episodes":27},{"id":"show-71728","type":"show","title":"Young Sheldon","year":2017,"addedAt":"2017-12-29","releaseDate":"2017-09-25","poster":"posters/show-71728.jpg","genres":["Comedy","Family","Drama"],"overview":"The early life of child genius Sheldon Cooper, later seen in The Big Bang Theory.","episodes":141},{"id":"show-61459","type":"show","title":"Parasyte -the maxim-","year":2014,"addedAt":"2017-12-31","releaseDate":"2014-10-09","poster":"posters/show-61459.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy","Action & Adventure"],"overview":"A species of parasitic aliens descends on Earth and quickly infiltrates humanity by entering the brains of vulnerable targets; insatiable beings that gain total control of their host and are capable of transforming themselves to feed on unsuspecting prey. High school student Shinichi Izumi falls victim to one of these parasites, but the creature fails to take over his brain and ends up in his right hand.","episodeRuntime":23,"episodes":24},{"id":"show-60808","type":"show","title":"No Game No Life","year":2014,"addedAt":"2017-12-31","releaseDate":"2014-04-09","poster":"posters/show-60808.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure","Comedy"],"overview":"Bored with life and considering the real world to be just a “crappy game,” savvy sibling shut-ins Sora and Shiro have withdrawn into their own fantasy world filled with video games. However, one day they find themselves summoned to another world by a boy who calls himself “God,” their abilities are about to be put to the ultimate test! Now not only their fates — but the fate of all of humanity — will be decided by a series of games that may just be the hardest these super-geniuses have ever faced!","episodeRuntime":23,"episodes":12},{"id":"show-42509","type":"show","title":"Steins;Gate","year":2011,"addedAt":"2017-12-31","releaseDate":"2011-04-06","poster":"posters/show-42509.jpg","genres":["Animation","Sci-Fi & Fantasy","Mystery","Comedy"],"overview":"A group of friends have customized their microwave so that it can send text messages to the past. As they perform different experiments, an organization named SERN who has been doing their own research on time travel tracks them down and now the characters have to find a way to avoid being captured by them.","episodeRuntime":24,"episodes":24},{"id":"show-31724","type":"show","title":"Code Geass: Lelouch of the Rebellion","year":2006,"addedAt":"2017-12-31","releaseDate":"2006-10-05","poster":"posters/show-31724.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure","Drama"],"overview":"Japan has been invaded and conquered by the Britannian Empire. Japan is now known as Area 11 and its citizens known as Elevens. The Britannian Empire takes away Japan's autonomous power and imposes its rule through the use of Knightmares. The Empire's rule has never faltered, but cracks have begun to show...","episodeRuntime":25,"episodes":50},{"id":"show-13916","type":"show","title":"Death Note","year":2006,"addedAt":"2017-12-31","releaseDate":"2006-10-04","poster":"posters/show-13916.jpg","genres":["Animation","Mystery","Sci-Fi & Fantasy"],"overview":"Light Yagami is an ace student with great prospects—and he’s bored out of his mind. But all that changes when he finds the Death Note, a notebook dropped by a rogue Shinigami death god. Any human whose name is written in the notebook dies, and Light has vowed to use the power of the Death Note to rid the world of evil. But will Light succeed in his noble goal, or will the Death Note turn him into the very thing he fights against?","episodeRuntime":22,"episodes":37},{"id":"show-31910","type":"show","title":"Naruto Shippuden","year":2007,"addedAt":"2017-12-31","releaseDate":"2007-02-15","poster":"posters/show-31910.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"After 2 and a half years Naruto finally returns to his village of Konoha, and sets about putting his ambitions to work. It will not be easy though as he has amassed a few more dangerous enemies, in the likes of the shinobi organization; Akatsuki.","episodeRuntime":25,"episodes":500},{"id":"show-78102","type":"show","title":"Steins;Gate 0","year":2018,"addedAt":"2018-04-26","releaseDate":"2018-04-12","poster":"posters/show-78102.jpg","genres":["Sci-Fi & Fantasy","Animation","Drama"],"overview":"Eccentric Rintaro falls into a depression after failing to save Kurisu, but then a neuroscientist offers him the chance to interact with an AI copy.","episodeRuntime":23,"episodes":23},{"id":"show-1668","type":"show","title":"Friends","year":1994,"addedAt":"2018-04-26","releaseDate":"1994-09-22","poster":"posters/show-1668.jpg","genres":["Comedy"],"overview":"Six young people from New York City, on their own and struggling to survive in the real world, find the companionship, comfort and support they get from each other to be the perfect antidote to the pressures of life.","episodes":228},{"id":"show-1408","type":"show","title":"House","year":2004,"addedAt":"2018-04-26","releaseDate":"2004-11-16","poster":"posters/show-1408.jpg","genres":["Drama"],"overview":"Dr. Gregory House, a drug-addicted, unconventional, misanthropic medical genius, leads a team of diagnosticians at the fictional Princeton–Plainsboro Teaching Hospital in New Jersey.","episodeRuntime":44,"episodes":176},{"id":"show-1396","type":"show","title":"Breaking Bad","year":2008,"addedAt":"2018-04-26","releaseDate":"2008-01-20","poster":"posters/show-1396.jpg","genres":["Drama","Crime"],"overview":"Walter White, a New Mexico chemistry teacher, is diagnosed with Stage III cancer and given a prognosis of only two years left to live. He becomes filled with a sense of fearlessness and an unrelenting desire to secure his family's financial future at any cost as he enters the dangerous world of drugs and crime.","episodes":62},{"id":"show-63926","type":"show","title":"One-Punch Man","year":2015,"addedAt":"2018-04-26","releaseDate":"2015-10-05","poster":"posters/show-63926.jpg","genres":["Animation","Comedy","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Saitama is a hero who only became a hero for fun. After three years of “special” training, though, he’s become so strong that he’s practically invincible. In fact, he’s too strong—even his mightiest opponents are taken out with a single punch, and it turns out that being devastatingly powerful is actually kind of a bore. With his passion for being a hero lost along with his hair, yet still faced with new enemies every day, how much longer can he keep it going?","episodeRuntime":24,"episodes":36},{"id":"show-71383","type":"show","title":"The Crossing","year":2018,"addedAt":"2018-04-29","releaseDate":"2018-04-02","poster":"posters/show-71383.jpg","genres":["Sci-Fi & Fantasy","Action & Adventure"],"overview":"Refugees from a war-torn country start showing up to seek asylum in an American town. Only the country these people are from is America and the war they are fleeing is 250 years in the future. The local sheriff with a past, a federal agent and a mother in search of her missing refugee daughter drive this allegory with a surprising conspiracy at the center.","episodeRuntime":44,"episodes":11},{"id":"show-62425","type":"show","title":"Dark Matter","year":2015,"addedAt":"2018-05-28","releaseDate":"2015-06-12","poster":"posters/show-62425.jpg","genres":["Sci-Fi & Fantasy","Drama"],"overview":"The six-person crew of a derelict spaceship awakens from stasis in the farthest reaches of space. Their memories wiped clean, they have no recollection of who they are or how they got on board. The only clue to their identities is a cargo bay full of weaponry and a destination: a remote mining colony that is about to become a war zone. With no idea whose side they are on, they face a deadly decision. Will these amnesiacs turn their backs on history, or will their pasts catch up with them?","episodeRuntime":43,"episodes":39},{"id":"show-79696","type":"show","title":"Manifest","year":2018,"addedAt":"2018-10-03","releaseDate":"2018-09-24","poster":"posters/show-79696.jpg","genres":["Sci-Fi & Fantasy","Mystery","Drama"],"overview":"After landing from a turbulent but routine flight, the crew and passengers of Montego Air Flight 828 discover five years have passed in what seemed like a few hours. As their new realities become clear, a deeper mystery unfolds and some of the returned passengers soon realize they may be meant for something greater than they ever thought possible.","episodeRuntime":42,"episodes":62},{"id":"show-1429","type":"show","title":"Attack on Titan","year":2013,"addedAt":"2018-10-08","releaseDate":"2013-04-07","poster":"posters/show-1429.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure"],"overview":"100 years ago, the last remnants of humanity were forced to retreat behind the towering walls of a fortified city to escape the massive, man-eating Titans that roamed the land outside their fortress. Only the members of the Scouting Legion dared to stray beyond the safety of the walls – but even those brave warriors seldom returned alive. Those within the city clung to the illusion of a peaceful existence until the day that dream was shattered, and their slim chance at survival was reduced to one horrifying choice: kill – or be devoured!","episodes":87},{"id":"show-60743","type":"show","title":"Constantine","year":2014,"addedAt":"2018-10-27","releaseDate":"2014-10-24","poster":"posters/show-60743.jpg","genres":["Action & Adventure","Drama","Sci-Fi & Fantasy"],"overview":"A man struggling with his faith is haunted by the sins of his past but is suddenly thrust into the role of defending humanity from the gathering forces of darkness.","episodeRuntime":43,"episodes":13},{"id":"show-73375","type":"show","title":"Tom Clancy's Jack Ryan","year":2018,"addedAt":"2018-10-27","releaseDate":"2018-08-30","poster":"posters/show-73375.jpg","genres":["Action & Adventure","Drama"],"overview":"When CIA analyst Jack Ryan stumbles upon a suspicious series of bank transfers his search for answers pulls him from the safety of his desk job and catapults him into a deadly game of cat and mouse throughout Europe and the Middle East, with a rising terrorist figurehead preparing for a massive attack against the US and her allies.","episodes":30},{"id":"show-82684","type":"show","title":"That Time I Got Reincarnated as a Slime","year":2018,"addedAt":"2018-11-18","releaseDate":"2018-10-02","poster":"posters/show-82684.jpg","genres":["Action & Adventure","Animation","Sci-Fi & Fantasy","Comedy"],"overview":"Corporate worker Mikami Satoru is stabbed by a random killer, and is reborn to an alternate world. But he turns out to be reborn a slime! Thrown into this new world with the name Rimuru, he begins his quest to create a world that’s welcoming to all races.","episodeRuntime":24,"episodes":96},{"id":"show-45782", ters/show-67075.jpg","genres":["Animation","Action & Adventure","Comedy","Sci-Fi & Fantasy"],"overview":"Shigeo Kageyama, a.k.a. \\"Mob,\\" is a boy who has trouble expressing himself, but who happens to be a powerful esper. Mob is determined to live a normal life and keeps his ESP suppressed, but when his emotions surge to a level of 100%, something terrible happens to him! As he's surrounded by false espers, evil spirits, and mysterious organizations, what will Mob think? What choices will he make?","episodeRuntime":24,"episodes":37},{"id":"show-78204","type":"show","title":"Sword Art Online Alternative: Gun Gale Online","year":2018,"addedAt":"2019-01-11","releaseDate":"2018-04-08","poster":"posters/show-78204.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"College student Karen takes up Gun Gale Online and gets a reputation as the Pink Demon. Then her gaming buddy Pitohui asks her to join the Squad Jam.","episodeRuntime":24,"episodes":24},{"id":"show-72636","type":"show","title":"Made in Abyss","year":2017,"addedAt":"2019-01-15","releaseDate":"2017-07-07","poster":"posters/show-72636.jpg","genres":["Animation","Drama","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Located in the center of a remote island, the Abyss is the last unexplored region, a huge and treacherous fathomless hole inhabited by strange creatures where only the bravest adventurers descend in search of ancient relics. In the upper levels of the Abyss, Riko, a girl who dreams of becoming an explorer, stumbles upon a mysterious little boy.","episodeRuntime":24,"episodes":25},{"id":"show-83095","type":"show","title":"The Rising of the Shield Hero","year":2019,"addedAt":"2019-01-15","releaseDate":"2019-01-09","poster":"posters/show-83095.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Drama"],"overview":"Iwatani Naofumi, a run-of-the-mill otaku, finds a book in the library that summons him to another world. He is tasked with joining the sword, nd of super-powered \\"quirk,\\" Izuku was unlucky enough to be born completely normal. But that’s not enough to stop him from enrolling in one of the world’s most prestigious hero academies.","episodeRuntime":24,"episodes":170},{"id":"show-31911","type":"show","title":"Fullmetal Alchemist: Brotherhood","year":2009,"addedAt":"2019-03-15","releaseDate":"2009-04-05","poster":"posters/show-31911.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Drama"],"overview":"Disregard for alchemy’s laws ripped half of Edward Elric’s limbs from his body and left his brother Alphonse’s soul clinging to a suit of armor. To restore what was lost, the brothers seek the Philosopher’s Stone. Enemies and allies – the corrupt military, the Homunculi, and foreign alchemists – will alter the Elric brothers course, but their purpose will remain unchanged and their bond unbreakable.","episodes":64},{"id":"show-61663","type":"show","title":"Your Lie in April","year":2014,"addedAt":"2019-03-15","releaseDate":"2014-10-10","poster":"posters/show-61663.jpg","genres":["Animation","Comedy","Drama"],"overview":"Kousei Arima was a genius pianist until his mother's sudden death took away his ability to play. Each day was dull for Kousei. But, then he meets a violinist named Kaori Miyazono who has an eccentric playing style. Can the heartfelt sounds of the girl's violin lead the boy to play the piano again?","episodeRuntime":23,"episodes":22},{"id":"show-83100","type":"show","title":"Dororo (2019)","year":2019,"addedAt":"2019-03-15","releaseDate":"2019-01-07","poster":"posters/show-83100.jpg","genres":["Animation","Action & Adventure"],"overview":"During the Warring States period, the young thief Dororo encounters Hyakkimaru, a strange, sightless boy who wields fearsome prosthetics in place of his missing limbs. Parts of Hyakkimaru’s body were traded to a group of 12 demons by his father in exchange for power, but thanks to a kindly medicine man, Hyakkimaru survived his horrifying ordeal. Now he roams the land in search of his missing body, and together he and Dororo will fight to survive in an unforgiving, demon-plagued world.","episodeRuntime":24,"episodes":24},{"id":"show-82875","type":"show","title":"Origin","year":2018,"addedAt":"2019-04-09","releaseDate":"2018-11-14","poster":"posters/show-82875.jpg","genres":["Sci-Fi & Fantasy"],"overview":"A group of troubled passengers wake up on a damaged spaceship abandoned in deep space, each having left behind a dark past in search of a fresh start on a newly colonized planet. As their terrifying situation spirals into paranoia, they come to realize that the greatest threat to their dream of starting over – and indeed their lives – is something far darker than the pasts they were so desperate to escape.","episodeRuntime":45,"episodes":10},{"id":"show-78670","type":"show","title":"Impulse","year":2018,"addedAt":"2019-04-11","releaseDate":"2018-06-06","poster":"posters/show-78670.jpg","genres":["Sci-Fi & Fantasy","Action & Adventure","Drama"],"overview":"16-year-old Henry Coles is an outsider in her new town of Reston, New York. With a major chip on her shoulder and no friends, she remains withdrawn and isolated, but everything changes when a traumatic encounter with a classmate triggers something deep within Henry— unleashing a power she cannot control.","episodes":20},{"id":"show-85937","type":"show","title":"Demon Slayer: Kimetsu no Yaiba","year":2019,"addedAt":"2019-04-12","releaseDate":"2019-04-06","poster":"posters/show-85937.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"After a demon attack leaves his family slain and his sister cursed, Tanjiro embarks upon a perilous journey to find a cure and avenge those he's lost.","episodes":63},{"id":"show-85844","type":"show","title":"Wise Man's Grandchild","year":2019,"addedAt":"2019-04-27","releaseDate":"2019-04-10","poster":"posters/show-85844.jpg","genres":["Animation","Comedy","Action & Adventure","Sci-Fi & Fantasy"] :"Harry Potter and the Prisoner of Azkaban","year":2004,"addedAt":"2019-08-18","releaseDate":"2004-05-31","poster":"posters/movie-673.jpg","genres":["Adventure","Fantasy"],"overview":"Harry Potter's life is in danger once more as dangerous wizard Sirius Black has escaped from Azkaban Prison and is heading to Hogwarts.","runtimeMinutes":141},{"id":"movie-284054","type":"movie","title":"Black Panther","year":2018,"addedAt":"2019-08-18","releaseDate":"2018-02-13","poster":"posters/movie-284054.jpg","genres":["Action","Adventure","Science Fiction"],"overview":"King T'Challa returns home to the reclusive, technologically advanced African nation of Wakanda to serve as his country's new leader. However, T'Challa soon finds that he is challenged for the throne by factions within his own country as well as without. Using powers reserved to Wakandan kings, T'Challa assumes the Black Panther mantle to join with ex-girlfriend Nakia, the queen-mother, his princess-kid sister, members of the Dora Milaje (the Wakandan 'special forces') and an American secret agent, to prevent Wakanda from being dragged into a world war.","runtimeMinutes":135},{"id":"movie-672","type":"movie","title":"Harry Potter and the Chamber of Secrets","year":2002,"addedAt":"2019-08-18","releaseDate":"2002-11-13","poster":"posters/movie-672.jpg","genres":["Adventure","Fantasy"],"overview":"Cars fly, trees fight back, and a mysterious house-elf comes to warn Harry Potter at the start of his second year at Hogwarts. Adventure and danger await when bloody writing on a wall announces: The Chamber Of Secrets Has Been Opened. To save Hogwarts will require all of Harry, Ron and Hermione's magical abilities and courage.","runtimeMinutes":161},{"id":"movie-429617","type":"movie","title":"Spider-Man: Far From Home","year":2019,"addedAt":"2019-08-18","releaseDate":"2019-06-28","poster":"posters/movie-429617.jpg","genres":["Action","Adventure","Science Fiction"],"overview":"Peter Parker and his friends go on a summer trip to Europe. However, they will hardly be able to rest - Peter will have to agree to help Nick Fury uncover the mystery of creatures that cause natural disasters and destruction throughout the continent.","runtimeMinutes":129},{"id":"movie-597","type":"movie","title":"Titanic","year":1997,"addedAt":"2019-08-18","releaseDate":"1997-12-18","poster":"posters/movie-597.jpg","genres":["Drama","Romance"],"overview":"101-year-old Rose DeWitt Bukater tells the story of her life aboard the Titanic, 84 years later. A young Rose boards the ship with her mother and fiancé. Meanwhile, Jack Dawson and Fabrizio De Rossi win third-class tickets aboard the ship. Rose tells the whole story from Titanic's departure through to its death—on its first and last voyage—on April 15, 1912.","runtimeMinutes":194},{"id":"movie-299537","type":"movie","title":"Captain Marvel","year":2019,"addedAt":"2019-08-18","releaseDate":"2019-03-06","poster":"posters/movie-299537.jpg","genres":["Action","Adventure","Science Fiction"],"overview":"The story follows Carol Danvers as she becomes one of the universe’s most powerful heroes when Earth is caught in the middle of a galactic war between two alien races. Set in the 1990s, Captain Marvel is an all-new adventure from a previously unseen period in the history of the Marvel Cinematic Universe.","runtimeMinutes":124},{"id":"movie-299534","type":"movie","title":"Avengers: Endgame","year":2019,"addedAt":"2019-08-18","releaseDate":"2019-04-24","poster":"posters/movie-299534.jpg","genres":["Adventure","Science Fiction","Action"],"overview":"After the devastating events of Avengers: Infinity War, the universe is in ruins due to the efforts of the Mad Titan, Thanos. With the help of remaining allies, the Avengers must assemble once more in order to undo Thanos' actions and restore order to the universe once and for all, no matter what consequences may be in store.","runtimeMinutes":181},{"id":"movie-315635","type":"movie","title":"Spider-Man: Homecoming","year":2 dedAt":"2019-08-23","releaseDate":"2018-02-02","poster":"posters/show-68421.jpg","genres":["Sci-Fi & Fantasy","Drama"],"overview":"After 250 years on ice, a prisoner returns to life in a new body with one chance to win his freedom: by solving a mind-bending murder.","episodes":18},{"id":"show-93256","type":"show","title":"Cautious Hero: The Hero Is Overpowered but Overly Cautious","year":2019,"addedAt":"2019-10-14","releaseDate":"2019-10-02","poster":"posters/show-93256.jpg","genres":["Animation","Action & Adventure","Comedy","Sci-Fi & Fantasy","War & Politics"],"overview":"Goddess Ristarte summons Seiya Ryuuguuin, an OVERLY cautious hero to save the world of Gaeabrande. Seiya is obsessed with muscle training and buying extra armor to deal with low level creatures. It’s simply one cautious mission at-a-time for this hero!","episodeRuntime":24,"episodes":12},{"id":"movie-559969","type":"movie","title":"El Camino: A Breaking Bad Movie","year":2019,"addedAt":"2019-10-14","releaseDate":"2019-10-11","poster":"posters/movie-559969.jpg","genres":["Crime","Drama","Thriller"],"overview":"In the wake of his dramatic escape from captivity, Jesse Pinkman must come to terms with his past in order to forge some kind of future.","runtimeMinutes":123},{"id":"show-91269","type":"show","title":"High School Prodigies Have It Easy Even in Another World!","year":2019,"addedAt":"2019-10-14","releaseDate":"2019-10-03","poster":"posters/show-91269.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure","Drama"],"overview":"Seven high school students are involved in an airplane crash. When they woke up, they found themselves in a parallel world where magic and beastmen exist. Of course, they panicked at their sudden unexpected predicament... or not? Instead, they create a power plant in a world that doesn't have electricity, they did a little extra work and managed to take economic control over a metropolis, they managed to repay their gratitude to some oppressed citizens by upending a corrupt government, and basically do whatever they feel like?!","episodeRuntime":24,"episodes":12},{"id":"show-60625","type":"show","title":"Rick and Morty","year":2013,"addedAt":"2019-11-05","releaseDate":"2013-12-02","poster":"posters/show-60625.jpg","genres":["Animation","Comedy","Sci-Fi & Fantasy","Action & Adventure"],"overview":"Follows a sociopathic genius scientist who drags his inherently timid grandson on adventures across the universe.","episodes":91},{"id":"show-92586","type":"show","title":"Somali and the Forest Spirit","year":2020,"addedAt":"2020-01-12","releaseDate":"2020-01-10","poster":"posters/show-92586.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Drama"],"overview":"The world is ruled by spirits, goblins, and all manner of strange creatures. Human beings are persecuted, to the very point of extinction. One day, a golem and a lone human girl meet.\\n\\nThis is a record of the pair, one a member of a ruined race, the other a watchman of the forest. It tells of their travels together and of the bond between father and daughter.","episodeRuntime":24,"episodes":12},{"id":"show-85942","type":"show","title":"Darwin's Game","year":2020,"addedAt":"2020-01-13","releaseDate":"2020-01-04","poster":"posters/show-85942.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Sudou Kaname, an ordinary high school student, receives an invitation email to try a mysterious app called \\"Darwin's Game.\\" Kaname, upon launching the app, is drawn into a game where players fight one another using superpowers called Sigils. Without knowing the reason for all this, can Kaname survive furious battles against the powerful players who attack him?","episodeRuntime":24,"episodes":11},{"id":"show-93149","type":"show","title":"Plunderer","year":2020,"addedAt":"2020-01-16","releaseDate":"2020-01-09","poster":"posters/show-93149.jpg","genres":["Action & Adventure","Sci-Fi & Fantasy","Animation"],"overview":"In a post-apocalyptic world dominated by the so-called \\"Numbers,\\" each human will have their identity branded with their own \\"Count,\\" which could define any number related to their life. May it be one's walked distance or amount of compliments given to them by others, this Count could lead them to the abyss when it has dropped to zero. In the year 305 of the Alcian calendar, Hina has inherited a mission from her Mother, whose Count has depreciated to zero, to search for the Legendary Red Baron. In her adventure, she meets a half-masked swordsman named Licht who tries to hide his identity, as he is known as a degenerate for having an incredibly low Count.","episodeRuntime":23,"episodes":24},{"id":"show-96402","type":"show","title":"Bofuri: I Don't Want to Get Hurt, so I'll Max Out My Defense","year":2020,"addedAt":"2020-01-17","releaseDate":"2020-01-08","poster":"posters/show-96402.jpg","genres":["Animation","Action & Adventure","Comedy","Sci-Fi & Fantasy"],"overview":"Kaede Honjou is invited by her friend Risa Shiramine to play a virtual reality MMO game with her. While Kaede doesn't dislike games, what she really, truly dislikes is being in pain. She creates a character named Maple, and decides to put all her points in VIT to minimize pain. As a result, she moves slowly, can't use magic, and even a rabbit can get the best of her. But as it turns out, she acquires a skill known as \\"Absolute Defense\\" as a result of her pumping points into VIT, as well as a \\"Counter Skill\\" that works against special moves. Now, with her ability to nullify all damage, she goes on adventures.","episodeRuntime":24,"episodes":24},{"id":"show-72739","type":"show","title":"Inside Edge","year":2017,"addedAt":"2020-01-28","releaseDate":"2017-07-09","poster":"posters/show-72739.jpg","genres":["Drama"],"overview":"The story of the Mumbai Mavericks, a T20 cricket franchise playing in the Powerplay League. Set in a landscape of conflicting interests, where selfishness is almost a virtue, e story of the beginning and the end of Rachel, the girl who climbed the tower so she could see the stars, and Bam, the boy who needed nothing but her.","episodeRuntime":24,"episodes":39},{"id":"show-98491","type":"show","title":"The Millionaire Detective – Balance: UNLIMITED","year":2020,"addedAt":"2020-04-10","releaseDate":"2020-04-10","poster":"posters/show-98491.jpg","genres":["Animation","Crime","Mystery"],"overview":"Two police detectives with different beliefs about the value of people's lives must cooperate to solve their city's most serious crimes.","episodeRuntime":23,"episodes":11},{"id":"movie-396535","type":"movie","title":"Train to Busan","year":2016,"addedAt":"2020-04-10","releaseDate":"2016-07-20","poster":"posters/movie-396535.jpg","genres":["Action","Horror","Thriller","Adventure"],"overview":"When a zombie virus pushes Korea into a state of emergency, those trapped on an express train to Busan must fight for their own survival.","runtimeMinutes":118},{"id":"movie-532067","type":"movie","title":"KONOSUBA – God's blessing on this wonderful world! Legend of Crimson","year":2019,"addedAt":"2020-04-10","releaseDate":"2019-08-30","poster":"posters/movie-532067.jpg","genres":["Animation","Comedy","Fantasy"],"overview":"After receiving a warning that Yunyun's hometown is in danger, Kazuma's party is relieved to discover it's only a joke...until it isn't. The Demon King's general has just arrived to obtain The Mage Killer, a weapon with world-ending power.","runtimeMinutes":90},{"id":"show-100911","type":"show","title":"Asur","year":2020,"addedAt":"2020-04-16","releaseDate":"2020-03-02","poster":"posters/show-100911.jpg","genres":["Crime","Drama","Mystery"],"overview":"Set in the backdrop of the mystical city of Varanasi, Asur follows Nikhil Nair, a forensic-expert-turned-teacher, who returns to his roots at the Central Bureau of Investigation, and along with his former mentor Dhananjay Rajpoot, finds himself caught in a cat-and-mouse game with a brutal serial killer. What follows is a blend of suspense, mythology and the murders of some people totally unrelated.","episodes":16},{"id":"show-58474","type":"show","title":"Cosmos (2014)","year":2014,"addedAt":"2020-04-28","releaseDate":"2014-03-09","poster":"posters/show-58474.jpg","genres":["Documentary"],"overview":"Famed astrophysicist Neil deGrasse Tyson provides clarity for the vision of the cosmos as he voyages across the universe with never-before-told stories that delve into the scientific concepts of the laws of gravity and the origins of space and time.","episodes":26},{"id":"show-102084","type":"show","title":"Hasmukh","year":2020,"addedAt":"2020-04-28","releaseDate":"2020-04-17","poster":"posters/show-102084.jpg","genres":["Crime","Drama","Comedy"],"overview":"A shy comedian gets his big break but soon realises he needs to murder people in order to keep his mojo on stage.","episodeRuntime":32,"episodes":10},{"id":"show-92592","type":"show","title":"BNA","year":2020,"addedAt":"2020-05-03","releaseDate":"2020-04-09","poster":"posters/show-92592.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Morphed into a raccoon beastman, Michiru seeks refuge, and answers, with the aid of wolf beastman Shirou inside the special zone of Anima-City.","episodeRuntime":23,"episodes":12},{"id":"show-99624","type":"show","title":"The 8th son? Are you kidding me?","year":2020,"addedAt":"2020-05-03","releaseDate":"2020-04-02","poster":"posters/show-99624.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Comedy"],"overview":"Ichinomiya Shingo, an everyday twenty-five-year-old office worker, wakes up as Wendelin, the 8th son of an impoverished noble family out in the sticks. He soon despairs at his lack of succession rights and knowledge to navigate the political world, but finds hope in his aptitude for magic. This is the story of that young man earning his keep and his freedom through magic, with no world saving involved, and spending quite a while escaping his solitude. Ultimately, it is also the story of him being unable to escape the shackles of society.","episodeRuntime":24,"episodes":12},{"id":"show-30981","type":"show","title":"Monster","year":2004,"addedAt":"2020-05-10","releaseDate":"2004-04-07","poster":"posters/show-30981.jpg","genres":["Animation","Drama","Mystery","Crime"],"overview":"Kenzou Tenma, a Japanese brain surgeon in Germany, finds his life in utter turmoil after getting involved with a psychopath that was once a former patient.","episodeRuntime":24,"episodes":74},{"id":"show-890","type":"show","title":"Neon Genesis Evangelion","year":1995,"addedAt":"2020-06-05","releaseDate":"1995-10-04","poster":"posters/show-890.jpg","genres":["Sci-Fi & Fantasy","Animation","Drama"],"overview":"At the turn of the century, the Angels returned to Earth, seeking to wipe out humanity in an apocalyptic fury. Devastated, mankind's last remnants moved underground to wait for the day when the Angels would come back to finish the job. Fifteen years later, that day has come... but this time, humanity is ready to fight back with terrifying bio-mechanical weapons known as the Evangelions. Watch as Shinji, Rei, Asuka and the rest of the mysterious shadow agency Nerv battle to save earth from total annihilation.","episodeRuntime":25,"episodes":26},{"id":"show-65942","type":"show","title":"Re: ZERO, Starting Life in Another World","year":2016,"addedAt":"2020-06-05","releaseDate":"2016-04-04","poster":"posters/show-65942.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Natsuki Subaru, an ordinary high school  student, is on his way home from the convenience store when he finds  himself transported to another world. As he's lost and confused in a new  world where he doesn't even know left from right, the only person to  reach out to him was a beautiful girl with silver hair. Determined to  repay her somehow for saving him from his own despair, Subaru agrees to  help the girl find something she's looking for.","episodeRuntime":25,"episodes":85},{"id":"show-84666","type":"show","title":"WATATEN!: an Angel Flew Down to Me","year":2019,"addedAt":"2020-06-21","releaseDate":"2019-01-08","poster":"posters/show-84666.jpg","genres":["Animation","Comedy"],"overview":"Miyako is a shy college student who is also an otaku. One day she happens to meet some angelic grade school kids! When Miyako sees her little sister's new friend Hana-chan, Miyako's heart won't stop racing! Miyako tries to get along with them but struggles... A sketch comedy all about trying to get along with the super cute girl is about to begin!","episodeRuntime":24,"episodes":12},{"id":"show-61223","type":"show","title":"Akame ga Kill!","year":2014,"addedAt":"2020-06-26","releaseDate":"2014-07-07","poster":"posters/show-61223.jpg","genres":["Animation","Drama","Action & Adventure"],"overview":"Young Tatsumi travels to the capital of the Empire in order to earn money for his starving people and encounters a world of unimaginable depravity, dominated by the ruthless Prime Minister who controls the child Emperor. Tatsumi is recruited by Night Raid, a group of assassins dedicated to eliminating corruption by mercilessly killing officials and privileged nobles.","episodeRuntime":24,"episodes":24},{"id":"show-88046","type":"show","title":"Fire Force","year":2019,"addedAt":"2020-07-01","releaseDate":"2019-07-05","poster":"posters/show-88046.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Comedy"],"overview":"Year 198 of the Solar Era in Tokyo, special fire brigades are fighting against a phenomenon called spontaneous human combustion where humans beings are turned into living infernos called \\"Infernals\\". While the Infernals are first generation cases of spontaneous human combustion, later generations possess the ability to manipulate flames while retaining human form. Shinra Kusakabe, a youth who gained the nickname Devil's Footprints for his ability to ignite his feet at will, joins the Special Fire Force Company 8 which composes of other flames users as they work to extinguish any Infernals they encounter. As a faction that is creating Infernals appears, Shira begins to uncover the truth behind a mysterious fire that caused the death of his family twelve years ago.","episodeRuntime":24,"episodes":73},{"id":"show-99778","type":"show","title":"The God of High School","year":2020,"addedAt":"2020-07-05","releaseDate":"2020-07-06","poster":"posters/show-99778.jpg","genres":["Animation","Comedy","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Jin Mori has proclaimed himself the strongest high schooler. His life changes when he's invited to participate in \\"God of High School,\\" a tournament to determine the strongest high schooler of all. He's told that if he wins, any wish he makes will be granted... All the participants are powerful contenders who fight their hardest for their own wishes. What awaits them at the end of the tournament? A chaotic battle between unbelievably strong high school students is about to begin!","episodeRuntime":24,"episodes":13},{"id":"show-97617","type":"show","title":"The Misfit of Demon King Academy","year":2020,"addedAt":"2020-07-07","releaseDate":"2020-07-04","poster":"posters/show-97617.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Anos Voldigord was a tyrannical Demon King that eradicated humans, spirits, and even the gods, but became bored of eternal warfare and reincarnated with dreams of a peaceful world. However, what awaited him in reincarnation after 2000 years were descendants who became too weak after being accustomed to peace, and all sorts of magic that deteriorated to the extreme. Anos enters Demon King Academy that gathers and educates those who are viewed as the reincarnation of the Demon King, but the academy could not see through his true powers and ends up branding him as a misfit.","episodeRuntime":24,"episodes":37},{"id":"show-92588","type":"show","title":"Deca-Dence","year":2020,"addedAt":"2020-07-15","releaseDate":"2020-07-08","poster":"posters/show-92588.jpg","genres":["Animation","Drama","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Many years have passed since humanity was driven to the brink of extinction by the sudden emergence of the unknown life forms Gadoll. Those humans that survived now dwell in a 3000m-high mobile fortress Deca-dence built to protect themselves from the Gadoll threat. Denizens of Deca-dence fall into two categories: Gears, warriors who fight the Gadoll daily, and Tankers, those without the skills to fight. One day, Natsume, a Tanker girl who dreams of becoming a Gear meets surly Kaburagi, an armor repairman of Deca-dence. This chance meeting between the seemingly two opposites, the girl with a positive attitude who never gives up on her dreams and the realist who has given up on his, will eventually shake the future course of this world.","episodeRuntime":24,"episodes":12},{"id":"show-96316","type":"show","title":"Rent-a-Girlfriend","year":2020,"addedAt":"2020-07-16","releaseDate":"2020-07-11","poster":"posters/show-96316.jpg","genres":["Animation","Comedy"],"overview":"Kinoshita Kazuya is a 20-year-old failure of a college student. He managed to kiss his girlfriend once, but was dumped after a month. Completely spiteful, Kazuya uses a certain method to date a girl. He goes to their meeting place and a beautiful girl brushing her long, black hair behind her ear was there, smiling at him. Her name was Mizuhara Chizuru. Something real is born after just a single rental! A reckless rom-com filled with love and excitement is about to begin!","episodeRuntime":25,"episodes":60},{"id":"show-99779","type":"show","title":"Noblesse","year":2020,"addedAt":"2020-10-07","releaseDate":"2020-10-08","poster":"posters/show-99779.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Comedy"],"overview":"Rai wakes up from 820-years long sleep and starts his new life as a student in a high school founded by his loyal servant, Frankenstein. But his peaceful days with other human students are soon interrupted by mysterious attackers known as the \\"Unions\\".","episodeRuntime":24,"episodes":13},{"id":"show-95479","type":"show","title":"JUJUTSU KAISEN","year":2020,"addedAt":"2020-10-10","releaseDate":"2020-10-03","poster":"posters/show-95479.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure"],"overview":"Yuji Itadori is a boy with tremendous physical strength, though he lives a completely ordinary high school life. One day, to save a classmate who has been attacked by curses, he eats the finger of Ryomen Sukuna, taking the curse into his own soul. From then on, he shares one body with Ryomen Sukuna. Guided by the most powerful of sorcerers, Satoru Gojo, Itadori is admitted to Tokyo Jujutsu High School, an organization that fights the curses... and thus begins the heroic tale of a boy who became a curse to exorcise a curse, a life from which he could never turn back.","episodeRuntime":24,"episodes":59},{"id":"show-100988","type":"show","title":"Higurashi: When They Cry","year":2020,"addedAt":"2020-10-12","releaseDate":"2020-10-01","poster":"posters/show-100988.jpg","genres":["Animation","Mystery","Sci-Fi & Fantasy","Drama"],"overview":"New kid Keiichi Maebara is settling into his new home of peaceful Hinamizawa village. Making quick friends with the girls from his school, he's arrived in time for the big festival of the year. But something about this isolated town seems \\"off,\\" and his feelings of dread continue to grow. With a gnawing fear that he's right, what dark secrets could this small community be hiding?","episodeRuntime":24,"episodes":39},{"id":"show-76479","type":"show","title":"The Boys","year":2019,"addedAt":"2020-10-17","releaseDate":"2019-07-25","poster":"posters/show-76479.jpg","genres":["Sci-Fi & Fantasy","Action & Adventure"],"overview":"A group of vigilantes known informally as “The Boys” set out to take down corrupt superheroes with no more than blue-collar grit and a willingness to fight dirty.","episodes":40},{"id":"show-111188","type":"show","title":"Scam 1992 - The Harshad Mehta Story","year":2020,"addedAt":"2020-10-30","releaseDate":"2020-10-09","poster":"posters/show-111188.jpg","genres":["Crime","Drama"],"overview":"Set in 1980's & 90's Bombay, Scam 1992 follows the life of Harshad Mehta - a stockbroker who single-handedly took the stock market to dizzying heights & his catastrophic downfall. Being directed by National Award-winning filmmaker Hansal Mehta, the series is based on journalist Debashis Basu & Sucheta Dalal's book \\"The Scam\\".","episodeRuntime":55,"episodes":10},{"id":"show-100436","type":"show","title":"Akudama Drive","year":2020,"addedAt":"2020-11-01","releaseDate":"2020-10-08","poster":"posters/show-100436.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy","Crime"],"overview":"Many years ago, a Great Civil War ravaged Japan, leaving the country fragmented between two regions: Kansai and Kanto. In Kansai, a group of six Akudama carry out missions given to them by a mysterious black cat, while evading the police. But a dangerous journey is about to unfold when a civilian girl becomes twisted into the Akudama's way of life and witnesses their criminal drives.","episodeRuntime":24,"episodes":12},{"id":"show-100281","type":"show","title":"Moriarty the Patriot","year":2020,"addedAt":"2020-11-02","releaseDate":"2020-10-11","poster":"posters/show-100281.jpg","genres":["Animation","Mystery"],"overview":"In the late 19th century, the British Empire nobility reigns while its working class suffers at their hands. Sympathetic to their plight, William James Moriarty wants to topple it all. Frustrated by the systemic inequity, Moriarty strategizes to fix the entire nation. Not even consulting detective Sherlock Holmes can stand in his way. It’s time for crime to revolutionize the world!","episodeRuntime":24,"episodes":24},{"id":"show-100612","type":"show","title":"Special Ops (2020)","year":2020,"addedAt":"2020-11-08","releaseDate":"2020-03-17","poster":"posters/show-100612.jpg","genres":["Mystery","Drama","Crime"],"overview":"The series follows Himmat Singh of Research and Analysis Wing who draws similar patterns in terrorist attacks and is convinced a single person is behind all the attacks. His task force team of five agents living in various parts of the world aim to catch the mastermind. The story is based on an inspiration taken from nineteen years worth of national significant events.","episodes":15},{"id":"show-85271","type":"show","title":"WandaVision","year":2021,"addedAt":"2021-01-20","releaseDate":"2021-01-15","poster":"posters/show-85271.jpg","genres":["Sci-Fi & Fantasy","Mystery","Drama"],"overview":"Wanda Maximoff and Vision—two super-powered beings living idealized suburban lives—begin to suspect that everything is not as it seems.","episodes":9},{"id":"show-114796","type":"show","title":"Tandav","year":2021,"addedAt":"2021-01-20","releaseDate":"2021-01-14","poster":"posters/show-114796.jpg","genres":["Drama","Crime","Mystery"],"overview":"Tandav is the coming together of different worlds under the gamut of politics. It is a dramatic take of the powerplay between people at the highest level where they get overthrown by others to secure their position. Young and upcoming student politicians are also featured and we get to see where their future is headed in this dark abyss of politics.","episodeRuntime":38,"episodes":9},{"id":"show-94664","type":"show","title":"Mushoku Tensei: Jobless Reincarnation","year":2021,"addedAt":"2021-01-24","releaseDate":"2021-01-11","poster":"posters/show-94664.jpg","genres":["Action & Adventure","Animation","Sci-Fi & Fantasy"],"overview":"When a 34-year-old underachiever gets run over by a truck, his story doesn't end there. Reincarnated in a new world as an infant, Rudy will seize every opportunity to live the life he's always wanted. Armed with new friends, some freshly acquired magical abilities, and the courage to do the things he's always dreamed of, he's embarking on an epic adventure—with all of his past experience intact!","episodeRuntime":24,"episodes":61},{"id":"movie-496243","type":"movie","title":"Parasite","year":2019,"addedAt":"2021-01-27","releaseDate":"2019-05-30","poster":"posters/movie-496243.jpg","genres":["Comedy","Thriller","Drama"],"overview":"All unemployed, Ki-taek's family takes peculiar interest in the wealthy and glamorous Parks for their livelihood until they get entangled in an unexpected incident.","runtimeMinutes":133},{"id":"show-110070","type":"show","title":"Horimiya","year":2021,"addedAt":"2021-02-21","releaseDate":"2021-01-10","poster":"posters/show-110070.jpg","genres":["Animation","Comedy","Drama"],"overview":"A secret life is the one thing they have in common. At school, Hori is a prim and perfect social butterfly, but the truth is she's a brash homebody. Meanwhile, under a gloomy facade, Miyamura hides a gentle heart, along with piercings and tattoos. In a chance meeting, they both reveal a side they've never shown. Could this blossom into something new?","episodeRuntime":24,"episodes":13},{"id":"movie-791373","type":"movie","title":"Zack Snyder's Justice League","year":2021,"addedAt":"2021-03-20","releaseDate":"2021-03-18","poster":"posters/movie-791373.jpg","genres":["Action","Adventure","Fantasy"],"overview":"Determined to ensure Superman's ultimate sacrifice was not in vain, Bruce Wayne aligns forces with Diana Prince with plans to recruit a team of metahumans to protect the world from an approaching threat of catastrophic proportions.","runtimeMinutes":242},{"id":"show-88396","type":"show","title":"The Falcon and The Winter Soldier","year":2021,"addedAt":"2021-03-20","releaseDate":"2021-03-19","poster":"posters/show-88396.jpg","genres":["Action & Adventure","Sci-Fi & Fantasy"],"overview":"Following the events of “Avengers: Endgame”, the Falcon, Sam Wilson and the Winter Soldier, Bucky Barnes team up in a global adventure that tests their abilities, and their patience.","episodes":6},{"id":"show-118541","type":"show","title":"The Slime Diaries","year":2021,"addedAt":"2021-04-06","releaseDate":"2021-04-06","poster":"posters/show-118541.jpg","genres":["Animation","Comedy","Sci-Fi & Fantasy"],"overview":"Even in another world, lives aren’t always on the line. There’s plenty of work to be done, from feeding the community and forging the items the community needs; as well as plenty of play …and hijinks throughout! Join Rimuru and friends as they kick back and enjoy their daily lives.","episodeRuntime":24,"episodes":12},{"id":"show-116725","type":"show","title":"Vivy: Fluorite Eye's Song","year":2021,"addedAt":"2021-05-05","releaseDate":"2021-04-03","poster":"posters/show-116725.jpg","genres":["Animation","Action & Adventure","Drama","Sci-Fi & Fantasy"],"overview":"In the near future, Vivy, a diva-type A.I., went up on stage each day with hopes of putting her heart into her song. One day, the A.I. Matsumoto, who claims to have arrived from 100 years in the future, appears before Vivy with an important request...","episodeRuntime":24,"episodes":13},{"id":"show-100565","type":"show","title":"86: Eighty Six","year":2021,"addedAt":"2021-05-05","releaseDate":"2021-04-11","poster":"posters/show-100565.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","War & Politics"],"overview":"Called “Juggernaut,” these are the unmanned combat drones developed by the Republic of San Magnolia in answer to the attacks by the autonomous unmanned drones of the neighboring Empire of Giad, the “Legion”. But they’re only unmanned in name. In reality, they are piloted by the Eighty-sixers—those considered to be less than human and treated as mere tools. Determined to achieve his own mysterious ends, Shin, the captain of Spearhead Squadron, which is comprised of Eighty-sixers, continues to fight a hopeless war on a battlefield where only death awaits him.","episodeRuntime":24,"episodes":23},{"id":"show-97525","type":"show","title":"To Your Eternity","year":2021,"addedAt":"2021-05-05","releaseDate":"2021-04-12","poster":"posters/show-97525.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"An immortal being takes on the form of a human boy, wandering the earth and experiencing the pains and joys of life throughout his story without end.","episodeRuntime":25,"episodes":62},{"id":"show-84958","type":"show","title":"Loki","year":2021,"addedAt":"2021-06-09","releaseDate":"2021-06-09","poster":"posters/show-84958.jpg","genres":["Drama","Sci-Fi & Fantasy"],"overview":"After stealing the Tesseract during the events of “Avengers: Endgame,” an alternate version of Loki is brought to the mysterious Time Variance Authority, a bureaucratic organization that exists outside of time and space and monitors the timeline. They give Loki a choice: face being erased from existence due to being a “time variant” or help fix the timeline and stop a greater threat.","episodes":12},{"id":"show-93405","type":"show","title":"Squid Game","year":2021,"addedAt":"2021-11-10","releaseDate":"2021-09-17","poster":"posters/show-93405.jpg","genres":["Action & Adventure","Mystery","Drama"],"overview":"Hundreds of cash-strapped players accept a strange invitation to compete in children's games. Inside, a tempting prize awaits — with deadly high stakes.","episodes":22},{"id":"show-94605","type":"show","title":"Arcane","year":2021,"addedAt":"2021-11-19","releaseDate":"2021-11-06","poster":"posters/show-94605.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Amid the stark discord of twin cities Piltover and Zaun, two sisters fight on rival sides of a war between magic technologies and clashing convictions.","episodes":18},{"id":"movie-512195","type":"movie","title":"Red Notice","year":2021,"addedAt":"2021-11-19","releaseDate":"2021-11-04","poster":"posters/movie-512195.jpg","genres":["Action","Comedy","Crime"],"overview":"An Interpol-issued Red Notice is a global alert to hunt and capture the world's most wanted. But when a daring heist brings together the FBI's top profiler and two rival criminals, there's no telling what will happen.","runtimeMinutes":118},{"id":"show-88329","type":"show","title":"Hawkeye (2021)","year":2021,"addedAt":"2021-12-13","releaseDate":"2021-11-24","poster":"posters/show-88329.jpg","genres":["Drama","Comedy","Action & Adventure"],"overview":"Former Avenger Clint Barton has a seemingly simple mission: get back to his family for Christmas. Possible? Maybe with the help of Kate Bishop, a 22-year-old archer with dreams of becoming a superhero. The two are forced to work together when a presence from Barton’s past threatens to derail far more than the festive spirit.","episodes":6},{"id":"show-121787","type":"show","title":"Takt op.Destiny","year":2021,"addedAt":"2021-12-13","releaseDate":"2021-10-06","poster":"posters/show-121787.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Music is the light that illuminates people's hearts-- and that \\"light\\" was suddenly taken from the world. The world changed the night the black \\"Kuroya Meteorite\\" fell. Grotesque monsters known as D2 emerged from the meteorite and began to overrun the land and people. As the D2 were drawn to melodies people played, eventually \\"music\\" itself became taboo. However, those who opposed the monsters appeared. They the \\"Musicart,\\" girls who draw power from music. They possess the great operas and musical scores of humanity history and use them to defeat the D2.","episodeRuntime":24,"episodes":12},{"id":"show-118821","type":"show","title":"The World's Finest Assassin Gets Reincarnated in Another World as an Aristocrat","year":2021,"addedAt":"2021-12-13","releaseDate":"2021-10-06","poster":"posters/show-118821.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"The l, Marin Kitagawa—seem like they live in a completely different world. That all changes one day, when she shares an unexpected secret with him, and their completely different worlds collide.","episodeRuntime":24,"episodes":24},{"id":"show-117933","type":"show","title":"Summer Time Rendering","year":2022,"addedAt":"2022-05-26","releaseDate":"2022-04-15","poster":"posters/show-117933.jpg","genres":["Animation","Drama","Mystery"],"overview":"Shinpei Ajiro travels home to attend the funeral of a childhood friend, and finds the remote island plagued by a sinister, supernatural force.","episodeRuntime":24,"episodes":25},{"id":"show-138441","type":"show","title":"Ya Boy Kongming!","year":2022,"addedAt":"2022-05-27","releaseDate":"2022-04-05","poster":"posters/show-138441.jpg","genres":["Animation","Comedy","Sci-Fi & Fantasy"],"overview":"General of the Three Kingdoms, Kongming had struggled his whole life, facing countless battles that made him into the accomplished strategist he was. So on his deathbed, he wished only to be reborn into a peaceful world... and was sent straight to modern-day party-central, Tokyo! Can even a brilliant strategist like Kongming adapt to the wild beats and even wilder party people?!","episodeRuntime":24,"episodes":12},{"id":"show-137718","type":"show","title":"Tomodachi Game","year":2022,"addedAt":"2022-05-27","releaseDate":"2022-04-06","poster":"posters/show-137718.jpg","genres":["Animation","Drama","Mystery"],"overview":"After his class' school trip fund is stolen, Yuichi and his best friends are abducted to play a debt repayment game; there is more than money on the line, as their bonds are tested with dark secrets and a lingering question of who is behind it all.","episodeRuntime":23,"episodes":12},{"id":"movie-798544","type":"movie","title":"Summer Ghost","year":2021,"addedAt":"2022-05-31","releaseDate":"2021-11-12","poster":"posters/movie-798544.jpg","genres":["Animation","Drama","Mystery","Fantasy"],"overview":"An urban legend says that ed to find their mother.","episodes":10},{"id":"show-119495","type":"show","title":"The Eminence in Shadow","year":2022,"addedAt":"2023-01-30","releaseDate":"2022-10-05","poster":"posters/show-119495.jpg","genres":["Animation","Comedy","Sci-Fi & Fantasy","Action & Adventure"],"overview":"Shadowbrokers are those who go unnoticed, posing as unremarkable people, when in truth, they control everything from behind the scenes. Sid wants to be someone just like that more than anything, and something as insignificant as boring reality isn’t going to get in his way! He trains in secret every single night, preparing for his eventual rise to power—only to be denied his destiny by a run-of-the-mill (yet deadly) traffic accident. But when he wakes up in a another world and suddenly finds himself at the head of an actual secret organization doing battle with evil in the shadows, he’ll finally get a chance to act out all of his delusional fantasies!","episodeRuntime":24,"episodes":32},{"id":"show-100088","type":"show","title":"The Last of Us","year":2023,"addedAt":"2023-02-23","releaseDate":"2023-01-15","poster":"posters/show-100088.jpg","genres":["Drama"],"overview":"Twenty years after modern civilization has been destroyed, Joel, a hardened survivor, is hired to smuggle Ellie, a 14-year-old girl, out of an oppressive quarantine zone. What starts as a small job soon becomes a brutal, heartbreaking journey, as they both must traverse the United States and depend on each other for survival.","episodes":16},{"id":"show-48891","type":"show","title":"Brooklyn Nine-Nine","year":2013,"addedAt":"2023-03-14","releaseDate":"2013-09-17","poster":"posters/show-48891.jpg","genres":["Comedy","Crime"],"overview":"A single-camera ensemble comedy following the lives of an eclectic group of detectives in a New York precinct, including one slacker who is forced to shape up when he gets a new boss.","episodes":152},{"id":"show-46533","type":"show","title":"The Americans (2013)","year":2013,"addedAt" unt down the people responsible.","episodes":16},{"id":"show-117465","type":"show","title":"Hell's Paradise","year":2023,"addedAt":"2023-04-18","releaseDate":"2023-04-01","poster":"posters/show-117465.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"For a chance at a pardon, a ninja assassin joins other condemned criminals on a journey to a mysterious island to retrieve an elixir of immortality.","episodeRuntime":25,"episodes":25},{"id":"show-203737","type":"show","title":"Oshi no Ko","year":2023,"addedAt":"2023-04-18","releaseDate":"2023-04-12","poster":"posters/show-203737.jpg","genres":["Animation","Drama"],"overview":"A small-town doctor gets sucked into the ruthless world of show business when he crosses paths with a popular teen idol who holds a secret.","episodes":35},{"id":"movie-876792","type":"movie","title":"That Time I Got Reincarnated as a Slime the Movie: Scarlet Bond","year":2022,"addedAt":"2023-10-12","releaseDate":"2022-11-25","poster":"posters/movie-876792.jpg","genres":["Animation","Fantasy","Adventure"],"overview":"A long-running conspiracy is swirling over a mysterious power wielded by the Queen in Raja, a small country west of Tempest. When a slime who evolved into a Demon Lord named Rimuru Tempest crosses paths with Hiiro, a survivor of the Ogre race, an incredible adventure packed with new characters begins. The power of bonds will be put to the test!","runtimeMinutes":108},{"id":"show-228663","type":"show","title":"Horimiya: The Missing Pieces","year":2023,"addedAt":"2023-11-09","releaseDate":"2023-07-01","poster":"posters/show-228663.jpg","genres":["Animation","Comedy","Drama"],"overview":"A new anime project that adapts popular side stories that were left out of the main anime series.\\n\\nAs the graduation ceremony at Katagiri High School comes to an end, Kyouko Hori, her boyfriend Izumi Miyamura, and their friends begin to look back on their time as students. The moments they shared together may be fleeting, but each one is a colorful piece of their precious memories.","episodeRuntime":24,"episodes":13},{"id":"movie-569094","type":"movie","title":"Spider-Man: Across the Spider-Verse","year":2023,"addedAt":"2023-11-10","releaseDate":"2023-05-31","poster":"posters/movie-569094.jpg","genres":["Animation","Action","Adventure","Science Fiction"],"overview":"After reuniting with Gwen Stacy, Brooklyn’s full-time, friendly neighborhood Spider-Man is catapulted across the Multiverse, where he encounters the Spider Society, a team of Spider-People charged with protecting the Multiverse's very existence. But when the heroes clash on how to handle a new threat, Miles finds himself pitted against the other Spiders and must set out on his own to save those he loves most.","runtimeMinutes":140},{"id":"show-205715","type":"show","title":"Gen V","year":2023,"addedAt":"2023-11-10","releaseDate":"2023-09-28","poster":"posters/show-205715.jpg","genres":["Action & Adventure","Drama","Sci-Fi & Fantasy"],"overview":"At America's only college for superheroes, gifted students put their moral boundaries to the test, competing for the university's top ranking, and a chance to join The Seven, Vought International's elite superhero team. When the school's dark secrets come to light, they must decide what kind of heroes they want to become.","episodes":16},{"id":"show-220542","type":"show","title":"The Apothecary Diaries","year":2023,"addedAt":"2023-11-10","releaseDate":"2023-10-22","poster":"posters/show-220542.jpg","genres":["Animation","Drama","Mystery"],"overview":"Maomao lived a peaceful life with her apothecary father. Until one day, she's sold as a lowly servant to the emperor's palace. But she wasn't meant for a compliant life among royalty. So when imperial heirs fall ill, she decides to step in and find a cure! This catches the eye of Jinshi, a handsome palace official who promotes her. Now, she's making a name for herself solving medical mysteries!","episodeRuntime":23,"episodes":48},{" ction"],"overview":"Set more than a decade after the events of the first film, learn the story of the Sully family (Jake, Neytiri, and their kids), the trouble that follows them, the lengths they go to keep each other safe, the battles they fight to stay alive, and the tragedies they endure.","runtimeMinutes":192},{"id":"movie-335988","type":"movie","title":"Transformers: The Last Knight","year":2017,"addedAt":"2025-04-26","releaseDate":"2017-06-16","poster":"posters/movie-335988.jpg","genres":["Action","Adventure","Science Fiction"],"overview":"Humans and Transformers are at war. Optimus Prime is gone. The key to saving our future lies buried in the secrets of the past, in the hidden history of Transformers on Earth. Saving our world falls upon the shoulders of an unlikely alliance: Cade Yeager; Bumblebee; an English Lord; and an Oxford Professor.","runtimeMinutes":154},{"id":"movie-424783","type":"movie","title":"Bumblebee","year":2018,"addedAt":"2025-04-26","releaseDate":"2018-11-22","poster":"posters/movie-424783.jpg","genres":["Action","Adventure","Science Fiction"],"overview":"On the run in the year 1987, Bumblebee finds refuge in a junkyard in a small Californian beach town. Charlie, on the cusp of turning 18 and trying to find her place in the world, discovers Bumblebee, battle-scarred and broken.  When Charlie revives him, she quickly learns this is no ordinary yellow VW bug.","runtimeMinutes":114},{"id":"movie-603692","type":"movie","title":"John Wick: Chapter 4","year":2023,"addedAt":"2025-04-26","releaseDate":"2023-03-21","poster":"posters/movie-603692.jpg","genres":["Action","Thriller","Crime"],"overview":"With the price on his head ever increasing, John Wick uncovers a path to defeating The High Table. But before he can earn his freedom, Wick must face off against a new enemy with powerful alliances across the globe and forces that turn old friends into foes.","runtimeMinutes":170},{"id":"movie-872585","type":"movie","title":"Oppenheimer","year":2023," nnects these people in a way, that ultimately changes their lives.","runtimeMinutes":149},{"id":"movie-19912","type":"movie","title":"The Final Destination","year":2009,"addedAt":"2025-04-26","releaseDate":"2009-08-26","poster":"posters/movie-19912.jpg","genres":["Horror","Mystery"],"overview":"A horrifying premonition saves a young man and his friends from death during a racetrack accident but terrible fates await them nonetheless.","runtimeMinutes":82},{"id":"movie-533535","type":"movie","title":"Deadpool & Wolverine","year":2024,"addedAt":"2025-04-26","releaseDate":"2024-07-24","poster":"posters/movie-533535.jpg","genres":["Action","Comedy","Science Fiction"],"overview":"A listless Wade Wilson toils away in civilian life with his days as the morally flexible mercenary, Deadpool, behind him. But when his homeworld faces an existential threat, Wade must reluctantly suit-up again with an even more reluctant Wolverine.","runtimeMinutes":128},{"id":"movie-1100782","type":"movie","title":"Smile 2","year":2024,"addedAt":"2025-04-26","releaseDate":"2024-10-16","poster":"posters/movie-1100782.jpg","genres":["Horror","Mystery"],"overview":"About to embark on a new world tour, global pop sensation Skye Riley begins experiencing increasingly terrifying and inexplicable events. Overwhelmed by the escalating horrors and the pressures of fame, Skye is forced to face her dark past to regain control of her life before it spirals out of control.","runtimeMinutes":127},{"id":"movie-1137339","type":"movie","title":"Kesari Chapter 2: The Untold Story of Jallianwala Bagh","year":2025,"addedAt":"2025-04-26","releaseDate":"2025-04-17","poster":"posters/movie-1137339.jpg","genres":["Drama","History"],"overview":"A dramatization of the life story of C. Sankaran Nair, the lawyer who fought for the truth behind the Jallianwala Bagh massacre.","runtimeMinutes":135},{"id":"movie-696506","type":"movie","title":"Mickey 17","year":2025,"addedAt":"2025-04-26","releaseDate":"2025-02-28","poster":" res":["Animation","Drama","Romance"],"overview":"Takao, who is training to become a shoemaker, skipped school and is sketching shoes in a Japanese-style garden. He meets a mysterious woman, Yukino, who is older than him. Then, without arranging the times, the two start to see each other again and again, but only on rainy days. They deepen their relationship and open up to each other. But the end of the rainy season soon approaches.","runtimeMinutes":46},{"id":"show-82739","type":"show","title":"Rascal Does Not Dream of Bunny Girl Senpai","year":2018,"addedAt":"2025-05-04","releaseDate":"2018-10-04","poster":"posters/show-82739.jpg","genres":["Animation","Comedy","Drama"],"overview":"Puberty Syndrome—a rumored, mysterious syndrome that only affects those in their puberty. For example, a bunny girl suddenly appeared in front of Sakuta Azusagawa. The bunny girl's real identity is Mai Sakurajima, a teenage celebrity who is currently an inactive high school senior. For some reason, her charming figure does not reflect in the eyes of others. In the course of revealing the mystery behind this phenomenon, Sakuta begins to explore his feelings towards Mai. Set in a city where the skies and seas shine, Sakuta unfolds the meaning behind his bizarre encounters on women with the said syndrome.","episodeRuntime":24,"episodes":26},{"id":"show-63145","type":"show","title":"Charlotte","year":2015,"addedAt":"2025-05-04","releaseDate":"2015-07-05","poster":"posters/show-63145.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy"],"overview":"All thanks to the special ability that he developed, Yuu was able to  cheat his way into a very prestigious high school. With his power, he  thought nothing was going to stand in his way, until he met a mysterious  girl named Nao Tomori and other students with special abilities just like him. It was the beginning to a new life.","episodeRuntime":24,"episodes":13},{"id":"movie-1244492","type":"movie","title":"Look Back","year":2024,"addedAt":"2025-05-04","releaseDate":"2024-06-28","poster":"posters/movie-1244492.jpg","genres":["Animation","Drama"],"overview":"Popular, outgoing Fujino is celebrated by her classmates for her funny comics in the class newspaper. One day, her teacher asks her to share the space with Kyomoto, a truant recluse whose beautiful artwork sparks a competitive fervor in Fujino. What starts as jealousy transforms when Fujino realizes their shared passion for drawing.","runtimeMinutes":58},{"id":"show-274069","type":"show","title":"Kowloon Generic Romance","year":2025,"addedAt":"2025-05-08","releaseDate":"2025-04-05","poster":"posters/show-274069.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy"],"overview":"Real estate agents Reiko Kujirai and Hajime Kudo work in the nostalgic Kowloon Walled City. As they spend more time together, Reiko’s feelings for Hajime grow. But when she finds a photo of him and his former fiancée, she’s shocked to see the woman looks exactly like her. Reiko then realizes a chilling truth: she has no memory of her past.","episodeRuntime":24,"episodes":13},{"id":"movie-1056803","type":"movie","title":"Rascal Does Not Dream of a Sister Venturing Out","year":2023,"addedAt":"2025-05-08","releaseDate":"2023-06-23","poster":"posters/movie-1056803.jpg","genres":["Animation","Drama","Fantasy"],"overview":"After a draining December, Sakuta is quickly nearing the end of his second year of high school. Since Mai is a third-year student, they don't have much time left together before graduation rolls around. Meanwhile, his sister, Kaede, is slowly but steadily venturing outdoors again. Just as she begins to find her footing, she announces her most ambitious goal yet—attending her brother's high school! Sakuta knows better than anyone how difficult this will be for Kaede, and he's ready to support her however he can. He's just not sure if that's what's best for her...or what she really wants...","runtimeMinutes":74},{"id":"movie-572154","type":"movie","title":"Rascal Does Not Dream of a Dreaming Girl","year":2019,"addedAt":"2025-05-08","releaseDate":"2019-06-15","poster":"posters/movie-572154.jpg","genres":["Animation","Romance","Drama","Fantasy"],"overview":"In Fujisawa, Sakuta Azusagawa is in his second year of high school. Blissful days with his girlfriend and upperclassman, Mai Sakurajima, are interrupted by the appearance of his first crush, Shoko Makinohara.","runtimeMinutes":90},{"id":"show-203040","type":"show","title":"KonoSuba: An Explosion on This Wonderful World!","year":2023,"addedAt":"2025-05-09","releaseDate":"2023-04-06","poster":"posters/show-203040.jpg","genres":["Animation","Comedy","Action & Adventure"],"overview":"This feisty young wizard will stop at nothing to master the spell that saved her life: Explosion! Megumin, the “Greatest Genius of the Crimson Magic Clan,” has chosen to devote her studies to the powerful offensive magic used by her mysterious savior. Then one day, her little sister finds a black kitten in the woods. But this cat isn’t just a new furry friend—she’s the key to awakening a Dark God!","episodeRuntime":24,"episodes":12},{"id":"show-63510","type":"show","title":"Attack on Titan: Junior High","year":2015,"addedAt":"2025-05-09","releaseDate":"2015-10-04","poster":"posters/show-63510.jpg","genres":["Animation","Action & Adventure","Comedy","Sci-Fi & Fantasy"],"overview":"Your favorite characters from Attack on Titan are back in…junior high school? Adapted from the hit spinoff manga series—Attack on Titan: Junior High (written by Saki Nakagawa), this parody reimagines Eren, Mikasa, Armin, and other characters from the original manga as students and teachers at Titan Junior High School.","episodeRuntime":17,"episodes":12},{"id":"show-208891","type":"show","title":"Heavenly Delusion","year":2023,"addedAt":"2025-05-13","releaseDate":"2023-04-01","poster":"posters/show-208891.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy"],"overview":"In the year 2024, the world has colla

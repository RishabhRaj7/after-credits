-16","releaseDate":"2015-06-24","poster":"posters/show-62560.jpg","genres":["Crime","Drama"],"overview":"A young programmer, Elliot, suffers from a debilitating anti-social disorder and decides that he can only connect to people by hacking them. He wields his skills as a weapon to protect the people that he cares about. Elliot finds himself in the intersection between a cybersecurity firm he works for and the underworld organizations that are recruiting him to bring down corporate America.","episodes":45},{"id":"show-38472","type":"show","title":"Marvel's Jessica Jones","year":2015,"addedAt":"2017-12-16","releaseDate":"2015-11-20","poster":"posters/show-38472.jpg","genres":["Sci-Fi & Fantasy","Drama"],"overview":"After a tragic ending to her short-lived super hero stint, Jessica Jones is rebuilding her personal life and career as a detective who gets pulled into cases involving people with extraordinary abilities in New York City.","episodes":39},{"id":"show-62104","type":"show","title":"The Seven Deadly Sins","year":2014,"addedAt":"2017-12-16","releaseDate":"2014-10-05","poster":"posters/show-62104.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"The “Seven Deadly Sins”—a group of evil knights who conspired to overthrow the kingdom of Britannia—were said to have been eradicated by the Holy Knights, although some claim that they still live. Ten years later, the Holy Knights have staged a Coup d'état and assassinated the king, becoming the new, tyrannical rulers of the kingdom. Elizabeth, the king's only daughter, sets out on a journey to find the “Seven Deadly Sins,” and to enlist their help in taking back the kingdom.","episodeRuntime":24,"episodes":96},{"id":"show-61889","type":"show","title":"Marvel's Daredevil","year":2015,"addedAt":"2017-12-16","releaseDate":"2015-04-10","poster":"posters/show-61889.jpg","genres":["Crime","Drama","Action & Adventure"],"overview":"Lawyer-by-day Matt Murdock uses his heightened senses from being blinded as a young boy to fight crime at night on the streets of Hell’s Kitchen as Daredevil.","episodes":39},{"id":"show-61374","type":"show","title":"Tokyo Ghoul","year":2014,"addedAt":"2017-12-16","releaseDate":"2014-07-04","poster":"posters/show-61374.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy"],"overview":"Ken Kaneki, a bookworm college student, meets Rize, a girl his own age with whom he shares many interests.","episodeRuntime":24,"episodes":48},{"id":"show-60735","type":"show","title":"The Flash (2014)","year":2014,"addedAt":"2017-12-16","releaseDate":"2014-10-07","poster":"posters/show-60735.jpg","genres":["Drama","Sci-Fi & Fantasy"],"overview":"After being struck by lightning, CSI investigator Barry Allen awakens from a nine-month coma to discover he has been  granted the gift of super speed.  Teaming up with S.T.A.R. Labs, Barry takes on the persona of The Flash, the Fastest  Man Alive, to protect his city.","episodes":184},{"id":"show-61664","type":"show","title":"Sense8","year":2015,"addedAt":"2017-12-16","releaseDate":"2015-06-05","poster":"posters/show-61664.jpg","genres":["Sci-Fi & Fantasy","Drama"],"overview":"One gunshot, one death, one moment out of time that irrevocably links eight minds in disparate parts of the world, putting them in each other's lives, each other's secrets, and in terrible danger. Ordinary people suddenly reborn as \\"Sensates.\\"","episodes":24},{"id":"show-1425","type":"show","title":"House of Cards (US)","year":2013,"addedAt":"2017-12-16","releaseDate":"2013-02-01","poster":"posters/show-1425.jpg","genres":["Drama"],"overview":"Betrayed by the White House, Congressman Frank Underwood embarks on a ruthless rise to power. Blackmail, seduction and ambition are his weapons.","episodes":73},{"id":"show-42009","type":"show","title":"Black Mirror","year":2011,"addedAt":"2017-12-16","releaseDate":"2011-12-04","poster":"posters/show-42009.jpg","genres":["Sci-Fi & Fantasy","Drama","Mystery"],"overview":"Twisted tales run wild in this mind-bending anthology series that reveals humanity's worst traits, greatest innovations and more.","episodes":33},{"id":"show-37680","type":"show","title":"Suits","year":2011,"addedAt":"2017-12-16","releaseDate":"2011-06-23","poster":"posters/show-37680.jpg","genres":["Drama"],"overview":"While running from a drug deal gone bad, Mike Ross, a brilliant young college-dropout, slips into a job interview with one of New York City's best legal closers, Harvey Specter. Tired of cookie-cutter law school grads, Harvey takes a gamble by hiring Mike on the spot after he recognizes his raw talent and photographic memory.","episodeRuntime":42,"episodes":134},{"id":"show-19885","type":"show","title":"Sherlock","year":2010,"addedAt":"2017-12-16","releaseDate":"2010-07-25","poster":"posters/show-19885.jpg","genres":["Crime","Drama","Mystery"],"overview":"A modern update finds the famous sleuth and his doctor partner solving crime in 21st century London.","episodeRuntime":90,"episodes":12},{"id":"show-63639","type":"show","title":"The Expanse","year":2015,"addedAt":"2017-12-18","releaseDate":"2015-12-14","poster":"posters/show-63639.jpg","genres":["Drama","Mystery","Sci-Fi & Fantasy"],"overview":"A thriller set two hundred years in the future following the case of a missing young woman who brings a hardened detective and a rogue ship's captain together in a race across the solar system to expose the greatest conspiracy in human history.","episodes":62},{"id":"show-67195","type":"show","title":"Legion","year":2017,"addedAt":"2017-12-18","releaseDate":"2017-02-08","poster":"posters/show-67195.jpg","genres":["Action & Adventure","Sci-Fi & Fantasy","Drama"],"overview":"David Haller, AKA Legion, is a troubled young man who may be more than human. Diagnosed as schizophrenic, David has been in and out of psychiatric hospitals for years. But after a strange encounter with a fellow patient, he’s confronted with the possibility that the voices he hears and the visions he sees might be real.","episodeRuntime":50,"episodes":27},{"id":"show-71728","type":"show","title":"Young Sheldon","year":2017,"addedAt":"2017-12-29","releaseDate":"2017-09-25","poster":"posters/show-71728.jpg","genres":["Comedy","Family","Drama"],"overview":"The early life of child genius Sheldon Cooper, later seen in The Big Bang Theory.","episodes":141},{"id":"show-61459","type":"show","title":"Parasyte -the maxim-","year":2014,"addedAt":"2017-12-31","releaseDate":"2014-10-09","poster":"posters/show-61459.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy","Action & Adventure"],"overview":"A species of parasitic aliens descends on Earth and quickly infiltrates humanity by entering the brains of vulnerable targets; insatiable beings that gain total control of their host and are capable of transforming themselves to feed on unsuspecting prey. High school student Shinichi Izumi falls victim to one of these parasites, but the creature fails to take over his brain and ends up in his right hand.","episodeRuntime":23,"episodes":24},{"id":"show-60808","type":"show","title":"No Game No Life","year":2014,"addedAt":"2017-12-31","releaseDate":"2014-04-09","poster":"posters/show-60808.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure","Comedy"],"overview":"Bored with life and considering the real world to be just a “crappy game,” savvy sibling shut-ins Sora and Shiro have withdrawn into their own fantasy world filled with video games. However, one day they find themselves summoned to another world by a boy who calls himself “God,” their abilities are about to be put to the ultimate test! Now not only their fates — but the fate of all of humanity — will be decided by a series of games that may just be the hardest these super-geniuses have ever faced!","episodeRuntime":23,"episodes":12},{"id":"show-42509","type":"show","title":"Steins;Gate","year":2011,"addedAt":"2017-12-31","releaseDate":"2011-04-06","poster":"posters/show-42509.jpg","genres":["Animation","Sci-Fi & Fantasy","Mystery","Comedy"],"overview":"A group of friends have customized their microwave so that it can send text messages to the past. As they perform different experiments, an organization named SERN who has been doing their own research on time travel tracks them down and now the characters have to find a way to avoid being captured by them.","episodeRuntime":24,"episodes":24},{"id":"show-31724","type":"show","title":"Code Geass: Lelouch of the Rebellion","year":2006,"addedAt":"2017-12-31","releaseDate":"2006-10-05","poster":"posters/show-31724.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure","Drama"],"overview":"Japan has been invaded and conquered by the Britannian Empire. Japan is now known as Area 11 and its citizens known as Elevens. The Britannian Empire takes away Japan's autonomous power and imposes its rule through the use of Knightmares. The Empire's rule has never faltered, but cracks have begun to show...","episodeRuntime":25,"episodes":50},{"id":"show-13916","type":"show","title":"Death Note","year":2006,"addedAt":"2017-12-31","releaseDate":"2006-10-04","poster":"posters/show-13916.jpg","genres":["Animation","Mystery","Sci-Fi & Fantasy"],"overview":"Light Yagami is an ace student with great prospects—and he’s bored out of his mind. But all that changes when he finds the Death Note, a notebook dropped by a rogue Shinigami death god. Any human whose name is written in the notebook dies, and Light has vowed to use the power of the Death Note to rid the world of evil. But will Light succeed in his noble goal, or will the Death Note turn him into the very thing he fights against?","episodeRuntime":22,"episodes":37},{"id":"show-31910","type":"show","title":"Naruto Shippuden","year":2007,"addedAt":"2017-12-31","releaseDate":"2007-02-15","poster":"posters/show-31910.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"After 2 and a half years Naruto finally returns to his village of Konoha, and sets about putting his eleaseDate":"2015-10-05","poster":"posters/show-63926.jpg","genres":["Animation","Comedy","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Saitama is a hero who only became a hero for fun. After three years of “special” training, though, he’s become so strong that he’s practically invincible. In fact, he’s too strong—even his mightiest opponents are taken out with a single punch, and it turns out that being devastatingly powerful is actually kind of a bore. With his passion for being a hero lost along with his hair, yet still faced with new enemies every day, how much longer can he keep it going?","episodeRuntime":24,"episodes":36},{"id":"show-71383","type":"show","title":"The Crossing","year":2018,"addedAt":"2018-04-29","releaseDate":"2018-04-02","poster":"posters/show-71383.jpg","genres":["Sci-Fi & Fantasy","Action & Adventure"],"overview":"Refugees from a war-torn country start showing up to seek asylum in an American town. Only the country these people are from is America and the war they are fleeing is 250 years in the future. The local sheriff with a past, a federal agent and a mother in search of her missing refugee daughter drive this allegory with a surprising conspiracy at the center.","episodeRuntime":44,"episodes":11},{"id":"show-62425","type":"show","title":"Dark Matter","year":2015,"addedAt":"2018-05-28","releaseDate":"2015-06-12","poster":"posters/show-62425.jpg","genres":["Sci-Fi & Fantasy","Drama"],"overview":"The six-person crew of a derelict spaceship awakens from stasis in the farthest reaches of space. Their memories wiped clean, they have no recollection of who they are or how they got on board. The only clue to their identities is a cargo bay full of weaponry and a destination: a remote mining colony that is about to become a war zone. With no idea whose side they are on, they face a deadly decision. Will these amnesiacs turn their backs on history, or will their pasts catch up with them?","episodeRuntime":43,"episodes":39},{"id":"show-79696","type":"show","title":"Manifest","year":2018,"addedAt":"2018-10-03","releaseDate":"2018-09-24","poster":"posters/show-79696.jpg","genres":["Sci-Fi & Fantasy","Mystery","Drama"],"overview":"After landing from a turbulent but routine flight, the crew and passengers of Montego Air Flight 828 discover five years have passed in what seemed like a few hours. As their new realities become clear, a deeper mystery unfolds and some of the returned passengers soon realize they may be meant for something greater than they ever thought possible.","episodeRuntime":42,"episodes":62},{"id":"show-1429","type":"show","title":"Attack on Titan","year":2013,"addedAt":"2018-10-08","releaseDate":"2013-04-07","poster":"posters/show-1429.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure"],"overview":"100 years ago, the last remnants of humanity were forced to retreat behind the towering walls of a fortified city to escape the massive, man-eating Titans that roamed the land outside their fortress. Only the members of the Scouting Legion dared to stray beyond the safety of the walls – but even those brave warriors seldom returned alive. Those within the city clung to the illusion of a peaceful existence until the day that dream was shattered, and their slim chance at survival was reduced to one horrifying choice: kill – or be devoured!","episodes":87},{"id":"show-60743","type":"show","title":"Constantine","year":2014,"addedAt":"2018-10-27","releaseDate":"2014-10-24","poster":"posters/show-60743.jpg","genres":["Action & Adventure","Drama","Sci-Fi & Fantasy"],"overview":"A man struggling with his faith is haunted by the sins of his past but is suddenly thrust into the role of defending humanity from the gathering forces of darkness.","episodeRuntime":43,"episodes":13},{"id":"show-73375","type":"show","title":"Tom Clancy's Jack Ryan","year":2018,"addedAt":"2018-10-27","releaseDate":"2018-08-30","poster":"posters/show-73375.jpg","genres":["Action & Adventure","Drama"],"overview":"When CIA analyst Jack Ryan stumbles upon a suspicious series of bank transfers his search for answers pulls him from the safety of his desk job and catapults him into a deadly game of cat and mouse throughout Europe and the Middle East, with a rising terrorist figurehead preparing for a massive attack against the US and her allies.","episodes":30},{"id":"show-82684","type":"show","title":"That Time I Got Reincarnated as a Slime","year":2018,"addedAt":"2018-11-18","releaseDate":"2018-10-02","poster":"posters/show-82684.jpg","genres":["Action & Adventure","Animation","Sci-Fi & Fantasy","Comedy"],"overview":"Corporate worker Mikami Satoru is stabbed by a random killer, and is reborn to an alternate world. But he turns out to be reborn a slime! Thrown into this new world with the name Rimuru, he begins his quest to create a world that’s welcoming to all races.","episodeRuntime":24,"episodes":96},{"id":"show-45782","type":"show","title":"Sword Art Online","year":2012,"addedAt":"2018-11-18","releaseDate":"2012-07-08","poster":"posters/show-45782.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure"],"overview":"In the near future, a Virtual Reality Massive Multiplayer Online Role-Playing Game (VRMMORPG) called Sword Art Online has been released where players control their avatars with their bodies using a piece of technology called Nerve Gear. One day, players discover they cannot log out, as the game creator is holding them captive unless they reach the 100th floor of the game's tower and defeat the final boss. However, if they die in the game, they die in real life. Their struggle for survival starts now...","episodeRuntime":24,"episodes":96},{"id":"show-84105","type":"show","title":"Mirzapur","year":2018,"addedAt":"2018-11-18","releaseDate":"2018-11-15","poster":"posters/show-84105.jpg","genres":["Crime","Action & Adventure","Drama"],"overview":"The iron-fisted Akhandanand Tripathi is a millionaire carpet exporter and the mafia don of Mirzapur. His son -01-15","releaseDate":"2017-07-07","poster":"posters/show-72636.jpg","genres":["Animation","Drama","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Located in the center of a remote island, the Abyss is the last unexplored region, a huge and treacherous fathomless hole inhabited by strange creatures where only the bravest adventurers descend in search of ancient relics. In the upper levels of the Abyss, Riko, a girl who dreams of becoming an explorer, stumbles upon a mysterious little boy.","episodeRuntime":24,"episodes":25},{"id":"show-83095","type":"show","title":"The Rising of the Shield Hero","year":2019,"addedAt":"2019-01-15","releaseDate":"2019-01-09","poster":"posters/show-83095.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Drama"],"overview":"Iwatani Naofumi, a run-of-the-mill otaku, finds a book in the library that summons him to another world. He is tasked with joining the sword, spear, and bow as one of the Four Cardinal Heroes and fighting the Waves of Catastrophe as the Shield Hero. Excited by the prospect of a grand adventure, Naofumi sets off with his party. However, merely a few days later, he is betrayed and loses all his money, dignity, and respect. Unable to trust anyone anymore, he employs a slave named Raphtalia and takes on the Waves and the world. But will he really find a way to overturn this desperate situation?","episodeRuntime":24,"episodes":62},{"id":"show-71194","type":"show","title":"The King's Avatar","year":2017,"addedAt":"2019-01-17","releaseDate":"2017-04-07","poster":"posters/show-71194.jpg","genres":["Animation","Action & Adventure"],"overview":"In the multiplayer online game Glory, Ye Xiu is regarded as a textbook and a top-tier pro-player. However, due to a myriad of reasons, he is kicked from the team. After leaving the pro scene, he finds work in an Internet Cafe as a manager. When Glory launches its tenth server, he throws himself in to the game once more. Possessing ten years of experience, the memories of his past, and an incomplete, self-made weapon, his return along the road to the summit begins!","episodeRuntime":20,"episodes":41},{"id":"show-75208","type":"show","title":"Devilman Crybaby","year":2018,"addedAt":"2019-02-03","releaseDate":"2018-01-05","poster":"posters/show-75208.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"With demons reawakened and humanity in turmoil, a sensitive demon-boy is led into a brutal, degenerate war against evil by his mysterious friend, Ryo.","episodeRuntime":25,"episodes":10},{"id":"show-83097","type":"show","title":"The Promised Neverland","year":2019,"addedAt":"2019-02-17","releaseDate":"2019-01-11","poster":"posters/show-83097.jpg","genres":["Animation","Drama","Mystery","Sci-Fi & Fantasy"],"overview":"Emma, Norman and Ray are the brightest kids at the Grace Field House orphanage. And under the care of the woman they refer to as “Mom,” all the kids have enjoyed a comfortable life. Good food, clean clothes and the perfect environment to learn—what more could an orphan ask for? One day, though, Emma and Norman uncover the dark truth of the outside world they are forbidden from seeing.","episodeRuntime":23,"episodes":23},{"id":"show-60863","type":"show","title":"Haikyu!!","year":2014,"addedAt":"2019-03-01","releaseDate":"2014-04-06","poster":"posters/show-60863.jpg","genres":["Animation","Comedy","Drama"],"overview":"Inspired by a small-statured pro volleyball player, Hinata creates a volleyball team in his last year of middle school. Unfortunately the team is matched up against the \\"King of the Court\\" Tobio Kageyama’s team in their first tournament and inevitably lose. After the crushing defeat, Hinata vows to surpass Kageyama After entering high school, Hinata joins the volleyball team only to find that Tobio has also joined.","episodeRuntime":24,"episodes":85},{"id":"show-64710","type":"show","title":"Noragami","year":2014,"addedAt":"2019-03-10","releaseDate":"2014-01-05","poster":"po in.","runtimeMinutes":149},{"id":"movie-278","type":"movie","title":"The Shawshank Redemption","year":1994,"addedAt":"2019-08-18","releaseDate":"1994-09-23","poster":"posters/movie-278.jpg","genres":["Drama","Crime"],"overview":"Imprisoned in the 1940s for the double murder of his wife and her lover, upstanding banker Andy Dufresne begins a new life at the Shawshank prison, where he puts his accounting skills to work for an amoral warden. During his long stretch in prison, Dufresne comes to be admired by the other inmates -- including an older prisoner named Red -- for his integrity and unquenchable sense of hope.","runtimeMinutes":142},{"id":"movie-284052","type":"movie","title":"Doctor Strange","year":2016,"addedAt":"2019-08-18","releaseDate":"2016-10-25","poster":"posters/movie-284052.jpg","genres":["Fantasy","Adventure","Action"],"overview":"After his career is destroyed, a brilliant but arrogant surgeon gets a new lease on life when a sorcerer takes him under her wing and trains him to defend the world against evil.","runtimeMinutes":115},{"id":"movie-209112","type":"movie","title":"Batman v Superman: Dawn of Justice","year":2016,"addedAt":"2019-08-18","releaseDate":"2016-03-23","poster":"posters/movie-209112.jpg","genres":["Action","Adventure","Fantasy"],"overview":"Fearing the actions of a god-like Super Hero left unchecked, Gotham City’s own formidable, forceful vigilante takes on Metropolis’s most revered, modern-day savior, while the world wrestles with what sort of hero it really needs. And with Batman and Superman at war with one another, a new threat quickly arises, putting mankind in greater danger than it’s ever known before.","runtimeMinutes":152},{"id":"movie-372058","type":"movie","title":"Your Name.","year":2016,"addedAt":"2019-08-18","releaseDate":"2016-07-01","poster":"posters/movie-372058.jpg","genres":["Animation","Romance","Drama"],"overview":"High schoolers Mitsuha and Taki are complete strangers living separate lives. But one night, they suddenly switch places. Mitsuha wakes up in Taki’s body, and he in hers. This bizarre occurrence continues to happen randomly, and the two must adjust their lives around each other.","runtimeMinutes":106},{"id":"movie-263115","type":"movie","title":"Logan","year":2017,"addedAt":"2019-08-18","releaseDate":"2017-02-28","poster":"posters/movie-263115.jpg","genres":["Action","Drama","Science Fiction"],"overview":"In the near future, a weary Logan cares for an ailing Professor X in a hideout on the Mexican border. But Logan's attempts to hide from the world and his legacy are upended when a young mutant arrives, pursued by dark forces.","runtimeMinutes":137},{"id":"movie-346364","type":"movie","title":"It","year":2017,"addedAt":"2019-08-18","releaseDate":"2017-09-06","poster":"posters/movie-346364.jpg","genres":["Horror","Thriller","Drama"],"overview":"In a small town in Maine, seven children known as The Losers Club come face to face with life problems, bullies and a monster that takes the shape of a clown called Pennywise.","runtimeMinutes":135},{"id":"movie-106646","type":"movie","title":"The Wolf of Wall Street","year":2013,"addedAt":"2019-08-18","releaseDate":"2013-12-25","poster":"posters/movie-106646.jpg","genres":["Crime","Drama","Comedy"],"overview":"A New York stockbroker refuses to cooperate in a large securities fraud case involving corruption on Wall Street, corporate banking world and mob infiltration. Based on Jordan Belfort's autobiography.","runtimeMinutes":180},{"id":"movie-155","type":"movie","title":"The Dark Knight","year":2008,"addedAt":"2019-08-18","releaseDate":"2008-07-16","poster":"posters/movie-155.jpg","genres":["Action","Thriller"],"overview":"Batman raises the stakes in his war on crime. With the help of Lt. Jim Gordon and District Attorney Harvey Dent, Batman sets out to dismantle the remaining criminal organizations that plague the streets. The partnership proves to be effective, but they soon find themselves prey to a reign of chaos unleash event Wakanda from being dragged into a world war.","runtimeMinutes":135},{"id":"movie-672","type":"movie","title":"Harry Potter and the Chamber of Secrets","year":2002,"addedAt":"2019-08-18","releaseDate":"2002-11-13","poster":"posters/movie-672.jpg","genres":["Adventure","Fantasy"],"overview":"Cars fly, trees fight back, and a mysterious house-elf comes to warn Harry Potter at the start of his second year at Hogwarts. Adventure and danger await when bloody writing on a wall announces: The Chamber Of Secrets Has Been Opened. To save Hogwarts will require all of Harry, Ron and Hermione's magical abilities and courage.","runtimeMinutes":161},{"id":"movie-429617","type":"movie","title":"Spider-Man: Far From Home","year":2019,"addedAt":"2019-08-18","releaseDate":"2019-06-28","poster":"posters/movie-429617.jpg","genres":["Action","Adventure","Science Fiction"],"overview":"Peter Parker and his friends go on a summer trip to Europe. However, they will hardly be able to rest - Peter will have to agree to help Nick Fury uncover the mystery of creatures that cause natural disasters and destruction throughout the continent.","runtimeMinutes":129},{"id":"movie-597","type":"movie","title":"Titanic","year":1997,"addedAt":"2019-08-18","releaseDate":"1997-12-18","poster":"posters/movie-597.jpg","genres":["Drama","Romance"],"overview":"101-year-old Rose DeWitt Bukater tells the story of her life aboard the Titanic, 84 years later. A young Rose boards the ship with her mother and fiancé. Meanwhile, Jack Dawson and Fabrizio De Rossi win third-class tickets aboard the ship. Rose tells the whole story from Titanic's departure through to its death—on its first and last voyage—on April 15, 1912.","runtimeMinutes":194},{"id":"movie-299537","type":"movie","title":"Captain Marvel","year":2019,"addedAt":"2019-08-18","releaseDate":"2019-03-06","poster":"posters/movie-299537.jpg","genres":["Action","Adventure","Science Fiction"],"overview":"The story follows Carol Danvers as she becomes one of ther and daughter.","episodeRuntime":24,"episodes":12},{"id":"show-85942","type":"show","title":"Darwin's Game","year":2020,"addedAt":"2020-01-13","releaseDate":"2020-01-04","poster":"posters/show-85942.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Sudou Kaname, an ordinary high school student, receives an invitation email to try a mysterious app called \\"Darwin's Game.\\" Kaname, upon launching the app, is drawn into a game where players fight one another using superpowers called Sigils. Without knowing the reason for all this, can Kaname survive furious battles against the powerful players who attack him?","episodeRuntime":24,"episodes":11},{"id":"show-93149","type":"show","title":"Plunderer","year":2020,"addedAt":"2020-01-16","releaseDate":"2020-01-09","poster":"posters/show-93149.jpg","genres":["Action & Adventure","Sci-Fi & Fantasy","Animation"],"overview":"In a post-apocalyptic world dominated by the so-called \\"Numbers,\\" each human will have their identity branded with their own \\"Count,\\" which could define any number related to their life. May it be one's walked distance or amount of compliments given to them by others, this Count could lead them to the abyss when it has dropped to zero. In the year 305 of the Alcian calendar, Hina has inherited a mission from her Mother, whose Count has depreciated to zero, to search for the Legendary Red Baron. In her adventure, she meets a half-masked swordsman named Licht who tries to hide his identity, as he is known as a degenerate for having an incredibly low Count.","episodeRuntime":23,"episodes":24},{"id":"show-96402","type":"show","title":"Bofuri: I Don't Want to Get Hurt, so I'll Max Out My Defense","year":2020,"addedAt":"2020-01-17","releaseDate":"2020-01-08","poster":"posters/show-96402.jpg","genres":["Animation","Action & Adventure","Comedy","Sci-Fi & Fantasy"],"overview":"Kaede Honjou is invited by her friend Risa Shiramine to play a virtual reality MMO game with her. While Kaede doesn't dislike games, what she really, truly dislikes is being in pain. She creates a character named Maple, and decides to put all her points in VIT to minimize pain. As a result, she moves slowly, can't use magic, and even a rabbit can get the best of her. But as it turns out, she acquires a skill known as \\"Absolute Defense\\" as a result of her pumping points into VIT, as well as a \\"Counter Skill\\" that works against special moves. Now, with her ability to nullify all damage, she goes on adventures.","episodeRuntime":24,"episodes":24},{"id":"show-72739","type":"show","title":"Inside Edge","year":2017,"addedAt":"2020-01-28","releaseDate":"2017-07-09","poster":"posters/show-72739.jpg","genres":["Drama"],"overview":"The story of the Mumbai Mavericks, a T20 cricket franchise playing in the Powerplay League. Set in a landscape of conflicting interests, where selfishness is almost a virtue, where sex, money, and power are mere means to an end, Inside Edge is a story that pulls no punches, minces no words, and takes no prisoners. Come witness the game behind the game.","episodeRuntime":45,"episodes":30},{"id":"show-71912","type":"show","title":"The Witcher","year":2019,"addedAt":"2020-02-05","releaseDate":"2019-12-20","poster":"posters/show-71912.jpg","genres":["Sci-Fi & Fantasy","Drama","Action & Adventure"],"overview":"Geralt of Rivia, a mutated monster-hunter for hire, journeys toward his destiny in a turbulent world where people often prove more wicked than beasts.","episodes":32},{"id":"show-1418","type":"show","title":"The Big Bang Theory","year":2007,"addedAt":"2020-02-16","releaseDate":"2007-09-24","poster":"posters/show-1418.jpg","genres":["Comedy"],"overview":"Physicists Leonard and Sheldon find their nerd-centric social circle with pals Howard and Raj expanding when aspiring actress Penny moves in next door.","episodeRuntime":22,"episodes":279},{"id":"show-92602","type":"show","title":"ID: INVADED","year":2020,"addedAt":"2020-02-20" ime, humanity is ready to fight back with terrifying bio-mechanical weapons known as the Evangelions. Watch as Shinji, Rei, Asuka and the rest of the mysterious shadow agency Nerv battle to save earth from total annihilation.","episodeRuntime":25,"episodes":26},{"id":"show-65942","type":"show","title":"Re: ZERO, Starting Life in Another World","year":2016,"addedAt":"2020-06-05","releaseDate":"2016-04-04","poster":"posters/show-65942.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Natsuki Subaru, an ordinary high school  student, is on his way home from the convenience store when he finds  himself transported to another world. As he's lost and confused in a new  world where he doesn't even know left from right, the only person to  reach out to him was a beautiful girl with silver hair. Determined to  repay her somehow for saving him from his own despair, Subaru agrees to  help the girl find something she's looking for.","episodeRuntime":25,"episodes":85},{"id":"show-84666","type":"show","title":"WATATEN!: an Angel Flew Down to Me","year":2019,"addedAt":"2020-06-21","releaseDate":"2019-01-08","poster":"posters/show-84666.jpg","genres":["Animation","Comedy"],"overview":"Miyako is a shy college student who is also an otaku. One day she happens to meet some angelic grade school kids! When Miyako sees her little sister's new friend Hana-chan, Miyako's heart won't stop racing! Miyako tries to get along with them but struggles... A sketch comedy all about trying to get along with the super cute girl is about to begin!","episodeRuntime":24,"episodes":12},{"id":"show-61223","type":"show","title":"Akame ga Kill!","year":2014,"addedAt":"2020-06-26","releaseDate":"2014-07-07","poster":"posters/show-61223.jpg","genres":["Animation","Drama","Action & Adventure"],"overview":"Young Tatsumi travels to the capital of the Empire in order to earn money for his starving people and encounters a world of unimaginable depravity, dominated by the ruthless Prime Minister who controls the child Emperor. Tatsumi is recruited by Night Raid, a group of assassins dedicated to eliminating corruption by mercilessly killing officials and privileged nobles.","episodeRuntime":24,"episodes":24},{"id":"show-88046","type":"show","title":"Fire Force","year":2019,"addedAt":"2020-07-01","releaseDate":"2019-07-05","poster":"posters/show-88046.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Comedy"],"overview":"Year 198 of the Solar Era in Tokyo, special fire brigades are fighting against a phenomenon called spontaneous human combustion where humans beings are turned into living infernos called \\"Infernals\\". While the Infernals are first generation cases of spontaneous human combustion, later generations possess the ability to manipulate flames while retaining human form. Shinra Kusakabe, a youth who gained the nickname Devil's Footprints for his ability to ignite his feet at will, joins the Special Fire Force Company 8 which composes of other flames users as they work to extinguish any Infernals they encounter. As a faction that is creating Infernals appears, Shira begins to uncover the truth behind a mysterious fire that caused the death of his family twelve years ago.","episodeRuntime":24,"episodes":73},{"id":"show-99778","type":"show","title":"The God of High School","year":2020,"addedAt":"2020-07-05","releaseDate":"2020-07-06","poster":"posters/show-99778.jpg","genres":["Animation","Comedy","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Jin Mori has proclaimed himself the strongest high schooler. His life changes when he's invited to participate in \\"God of High School,\\" a tournament to determine the strongest high schooler of all. He's told that if he wins, any wish he makes will be granted... All the participants are powerful contenders who fight their hardest for their own wishes. What awaits them at the end of the tournament? A chaotic battle between unbelievably strong high school students is about to begin!","episodeRuntime":24,"episodes":13},{"id":"show-97617","type":"show","title":"The Misfit of Demon King Academy","year":2020,"addedAt":"2020-07-07","releaseDate":"2020-07-04","poster":"posters/show-97617.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Anos Voldigord was a tyrannical Demon King that eradicated humans, spirits, and even the gods, but became bored of eternal warfare and reincarnated with dreams of a peaceful world. However, what awaited him in reincarnation after 2000 years were descendants who became too weak after being accustomed to peace, and all sorts of magic that deteriorated to the extreme. Anos enters Demon King Academy that gathers and educates those who are viewed as the reincarnation of the Demon King, but the academy could not see through his true powers and ends up branding him as a misfit.","episodeRuntime":24,"episodes":37},{"id":"show-92588","type":"show","title":"Deca-Dence","year":2020,"addedAt":"2020-07-15","releaseDate":"2020-07-08","poster":"posters/show-92588.jpg","genres":["Animation","Drama","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Many years have passed since humanity was driven to the brink of extinction by the sudden emergence of the unknown life forms Gadoll. Those humans that survived now dwell in a 3000m-high mobile fortress Deca-dence built to protect themselves from the Gadoll threat. Denizens of Deca-dence fall into two categories: Gears, warriors who fight the Gadoll daily, and Tankers, those without the skills to fight. One day, Natsume, a Tanker girl who dreams of becoming a Gear meets surly Kaburagi, an armor repairman of Deca-dence. This chance meeting between the seemingly two opposites, the girl with a positive attitude who never gives up on her dreams and the realist who has given up on his, will eventually shake the future course of this world.","episodeRuntime":24,"episodes":12},{"id":"show-96316","type":"show","title":"Rent-a-Girlfriend","year":2020,"addedAt":"2020-07-16","releaseDate":"2020-07-11","poster":"posters/show-96316.jpg","genres":["Animation","Comedy"],"overview":"Kinoshita Kazuya is a 20-year-old failure of a college student. He managed to kiss his girlfriend once, but was dumped after a month. Completely spiteful, Kazuya uses a certain method to date a girl. He goes to their meeting place and a beautiful girl brushing her long, black hair behind her ear was there, smiling at him. Her name was Mizuhara Chizuru. Something real is born after just a single rental! A reckless rom-com filled with love and excitement is about to begin!","episodeRuntime":25,"episodes":60},{"id":"show-99779","type":"show","title":"Noblesse","year":2020,"addedAt":"2020-10-07","releaseDate":"2020-10-08","poster":"posters/show-99779.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Comedy"],"overview":"Rai wakes up from 820-years long sleep and starts his new life as a student in a high school founded by his loyal servant, Frankenstein. But his peaceful days with other human students are soon interrupted by mysterious attackers known as the \\"Unions\\".","episodeRuntime":24,"episodes":13},{"id":"show-95479","type":"show","title":"JUJUTSU KAISEN","year":2020,"addedAt":"2020-10-10","releaseDate":"2020-10-03","poster":"posters/show-95479.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure"],"overview":"Yuji Itadori is a boy with tremendous physical strength, though he lives a completely ordinary high school life. One day, to save a classmate who has been attacked by curses, he eats the finger of Ryomen Sukuna, taking the curse into his own soul. From then on, he shares one body with Ryomen Sukuna. Guided by the most powerful of sorcerers, Satoru Gojo, Itadori is admitted to Tokyo Jujutsu High School, an organization that fights the curses... and thus begins the heroic tale of a boy who became a curse to exorcise a curse, a life from which he could never turn back.","episodeRuntime":24,"episod nd Kanto. In Kansai, a group of six Akudama carry out missions given to them by a mysterious black cat, while evading the police. But a dangerous journey is about to unfold when a civilian girl becomes twisted into the Akudama's way of life and witnesses their criminal drives.","episodeRuntime":24,"episodes":12},{"id":"show-100281","type":"show","title":"Moriarty the Patriot","year":2020,"addedAt":"2020-11-02","releaseDate":"2020-10-11","poster":"posters/show-100281.jpg","genres":["Animation","Mystery"],"overview":"In the late 19th century, the British Empire nobility reigns while its working class suffers at their hands. Sympathetic to their plight, William James Moriarty wants to topple it all. Frustrated by the systemic inequity, Moriarty strategizes to fix the entire nation. Not even consulting detective Sherlock Holmes can stand in his way. It’s time for crime to revolutionize the world!","episodeRuntime":24,"episodes":24},{"id":"show-100612","type":"show","title":"Special Ops (2020)","year":2020,"addedAt":"2020-11-08","releaseDate":"2020-03-17","poster":"posters/show-100612.jpg","genres":["Mystery","Drama","Crime"],"overview":"The series follows Himmat Singh of Research and Analysis Wing who draws similar patterns in terrorist attacks and is convinced a single person is behind all the attacks. His task force team of five agents living in various parts of the world aim to catch the mastermind. The story is based on an inspiration taken from nineteen years worth of national significant events.","episodes":15},{"id":"show-85271","type":"show","title":"WandaVision","year":2021,"addedAt":"2021-01-20","releaseDate":"2021-01-15","poster":"posters/show-85271.jpg","genres":["Sci-Fi & Fantasy","Mystery","Drama"],"overview":"Wanda Maximoff and Vision—two super-powered beings living idealized suburban lives—begin to suspect that everything is not as it seems.","episodes":9},{"id":"show-114796","type":"show","title":"Tandav","year":2021,"addedAt":"2021-01-20","releaseDate" r and sees Gabriel's reflection in a window.","episodeRuntime":52,"episodes":6},{"id":"show-229221","type":"show","title":"Dear Child","year":2023,"addedAt":"2024-03-17","releaseDate":"2023-09-07","poster":"posters/show-229221.jpg","genres":["Crime","Drama","Mystery"],"overview":"A mysterious woman's escape from her harrowing captivity points investigators toward the dark truth behind an unsolved disappearance 13 years earlier.","episodeRuntime":48,"episodes":6},{"id":"show-137206","type":"show","title":"Till The End of The Moon","year":2023,"addedAt":"2024-03-17","releaseDate":"2023-04-06","poster":"posters/show-137206.jpg","genres":["Drama"],"overview":"In an era when the demons are in power, they are the masters of the despicable cultivators and mortals. The cultivator elders deem it necessary to send someone back in time to determine the origin of the demon lord and to prevent his awakening. Li Susu accepts the mission, becoming the mortal Ye Xiwu, General Ye's third daughter, who is married to Tantai Jin, the hostage prince and future demon lord. She is determined to destroy Tantai Jin, who, in the future, will massacre many. But as a witness to Tantai Jin's past life and rise to power, an unexpected tale emerges, one complicating her quest.","episodeRuntime":55,"episodes":40},{"id":"show-95396","type":"show","title":"Severance","year":2022,"addedAt":"2024-03-22","releaseDate":"2022-02-17","poster":"posters/show-95396.jpg","genres":["Drama","Mystery","Sci-Fi & Fantasy"],"overview":"Mark leads a team of office workers whose memories have been surgically divided between their work and personal lives. When a mysterious colleague appears outside of work, it begins a journey to discover the truth about their jobs.","episodes":19},{"id":"show-73411","type":"show","title":"Maniac (2018)","year":2018,"addedAt":"2024-03-22","releaseDate":"2018-09-21","poster":"posters/show-73411.jpg","genres":["Comedy","Drama","Sci-Fi & Fantasy"],"overview":"Two strangers are drawn to a in their journey north.","episodeRuntime":24,"episodes":25},{"id":"show-1434","type":"show","title":"Family Guy","year":1999,"addedAt":"2024-07-12","releaseDate":"1999-01-31","poster":"posters/show-1434.jpg","genres":["Animation","Comedy"],"overview":"Sick, twisted, politically incorrect and Freakin' Sweet animated series featuring the adventures of the dysfunctional Griffin family. Bumbling Peter and long-suffering Lois have three kids. Stewie (a brilliant but sadistic baby bent on killing his mother and taking over the world), Meg (the oldest, and is the most unpopular girl in town) and Chris (the middle kid, he's not very bright but has a passion for movies). The final member of the family is Brian - a talking dog and much more than a pet, he keeps Stewie in check whilst sipping Martinis and sorting through his own life issues.","episodes":456},{"id":"show-1420","type":"show","title":"New Girl","year":2011,"addedAt":"2024-07-12","releaseDate":"2011-09-20","poster":"posters/show-1420.jpg","genres":["Comedy"],"overview":"Jessica Day is an offbeat and adorable girl in her late 20s who, after a bad breakup, moves in with three single guys. Goofy, positive, vulnerable and honest to a fault, Jess has faith in people, even when she shouldn't. Although she's dorky and awkward, she's comfortable in her own skin. More prone to friendships with women, she's not used to hanging with the boys—especially at home.","episodeRuntime":22,"episodes":146},{"id":"show-255107","type":"show","title":"Code Geass: Rozé of the Recapture","year":2024,"addedAt":"2024-07-13","releaseDate":"2024-06-21","poster":"posters/show-255107.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Year Seven of the Kowa Period, in the former Hokkaido Block, live brothers known as the Nameless Mercenaries. The Emperor, Callis al Britannia, tries to plunge the world into chaos with the help of his servant, Norland, and his Einberg Knights. Rozé and Ash take action from the Northern ealing the mystery behind this phenomenon, Sakuta begins to explore his feelings towards Mai. Set in a city where the skies and seas shine, Sakuta unfolds the meaning behind his bizarre encounters on women with the said syndrome.","episodeRuntime":24,"episodes":26},{"id":"show-63145","type":"show","title":"Charlotte","year":2015,"addedAt":"2025-05-04","releaseDate":"2015-07-05","poster":"posters/show-63145.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy"],"overview":"All thanks to the special ability that he developed, Yuu was able to  cheat his way into a very prestigious high school. With his power, he  thought nothing was going to stand in his way, until he met a mysterious  girl named Nao Tomori and other students with special abilities just like him. It was the beginning to a new life.","episodeRuntime":24,"episodes":13},{"id":"movie-1244492","type":"movie","title":"Look Back","year":2024,"addedAt":"2025-05-04","releaseDate":"2024-06-28","poster":"posters/movie-1244492.jpg","genres":["Animation","Drama"],"overview":"Popular, outgoing Fujino is celebrated by her classmates for her funny comics in the class newspaper. One day, her teacher asks her to share the space with Kyomoto, a truant recluse whose beautiful artwork sparks a competitive fervor in Fujino. What starts as jealousy transforms when Fujino realizes their shared passion for drawing.","runtimeMinutes":58},{"id":"show-274069","type":"show","title":"Kowloon Generic Romance","year":2025,"addedAt":"2025-05-08","releaseDate":"2025-04-05","poster":"posters/show-274069.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy"],"overview":"Real estate agents Reiko Kujirai and Hajime Kudo work in the nostalgic Kowloon Walled City. As they spend more time together, Reiko’s feelings for Hajime grow. But when she finds a photo of him and his former fiancée, she’s shocked to see the woman looks exactly like her. Reiko then realizes a chilling truth: she has no memory of her past.","episodeRuntime":24,"episodes": d!","episodeRuntime":24,"episodes":12},{"id":"show-63510","type":"show","title":"Attack on Titan: Junior High","year":2015,"addedAt":"2025-05-09","releaseDate":"2015-10-04","poster":"posters/show-63510.jpg","genres":["Animation","Action & Adventure","Comedy","Sci-Fi & Fantasy"],"overview":"Your favorite characters from Attack on Titan are back in…junior high school? Adapted from the hit spinoff manga series—Attack on Titan: Junior High (written by Saki Nakagawa), this parody reimagines Eren, Mikasa, Armin, and other characters from the original manga as students and teachers at Titan Junior High School.","episodeRuntime":17,"episodes":12},{"id":"show-208891","type":"show","title":"Heavenly Delusion","year":2023,"addedAt":"2025-05-13","releaseDate":"2023-04-01","poster":"posters/show-208891.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy"],"overview":"In the year 2024, the world has collapsed. Grotesque monsters lurk amongst the ruins of Japan, while remaining people scrape together what they can to survive. Kiruko, an odd-job girl in Nakano, accepts a mysterious woman's dying wish to take a boy named Maru to a place called Heaven. Maru is convinced that there will be a boy there who looks exactly like him.","episodeRuntime":24,"episodes":13},{"id":"show-65945","type":"show","title":"Kabaneri of the Iron Fortress","year":2016,"addedAt":"2025-05-18","releaseDate":"2016-04-08","poster":"posters/show-65945.jpg","genres":["Animation","Drama","Action & Adventure","Sci-Fi & Fantasy"],"overview":"In the midst of an industrial revolution, the people of Hinomoto fight hordes of undead creatures, known as Kabane, using powerful armored trains.","episodeRuntime":22,"episodes":12},{"id":"movie-893712","type":"movie","title":"Sword Art Online the Movie – Progressive – Scherzo of Deep Night","year":2022,"addedAt":"2025-05-22","releaseDate":"2022-10-22","poster":"posters/movie-893712.jpg","genres":["Animation","Action","Fantasy","Science Fiction"],"overv

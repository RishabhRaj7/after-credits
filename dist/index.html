nfiltrates humanity by entering the brains of vulnerable targets; insatiable beings that gain total control of their host and are capable of transforming themselves to feed on unsuspecting prey. High school student Shinichi Izumi falls victim to one of these parasites, but the creature fails to take over his brain and ends up in his right hand.","episodeRuntime":23,"episodes":24},{"id":"show-60808","type":"show","title":"No Game No Life","year":2014,"addedAt":"2017-12-31","releaseDate":"2014-04-09","poster":"posters/show-60808.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure","Comedy"],"overview":"Bored with life and considering the real world to be just a “crappy game,” savvy sibling shut-ins Sora and Shiro have withdrawn into their own fantasy world filled with video games. However, one day they find themselves summoned to another world by a boy who calls himself “God,” their abilities are about to be put to the ultimate test! Now not only their fates — but the fate of all of humanity — will be decided by a series of games that may just be the hardest these super-geniuses have ever faced!","episodeRuntime":23,"episodes":12},{"id":"show-42509","type":"show","title":"Steins;Gate","year":2011,"addedAt":"2017-12-31","releaseDate":"2011-04-06","poster":"posters/show-42509.jpg","genres":["Animation","Sci-Fi & Fantasy","Mystery","Comedy"],"overview":"A group of friends have customized their microwave so that it can send text messages to the past. As they perform different experiments, an organization named SERN who has been doing their own research on time travel tracks them down and now the characters have to find a way to avoid being captured by them.","episodeRuntime":24,"episodes":24},{"id":"show-31724","type":"show","title":"Code Geass: Lelouch of the Rebellion","year":2006,"addedAt":"2017-12-31","releaseDate":"2006-10-05","poster":"posters/show-31724.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure","Drama"],"overview":"Japan has been invaded and conquered by the Britannian Empire. Japan is now known as Area 11 and its citizens known as Elevens. The Britannian Empire takes away Japan's autonomous power and imposes its rule through the use of Knightmares. The Empire's rule has never faltered, but cracks have begun to show...","episodeRuntime":25,"episodes":50},{"id":"show-13916","type":"show","title":"Death Note","year":2006,"addedAt":"2017-12-31","releaseDate":"2006-10-04","poster":"posters/show-13916.jpg","genres":["Animation","Mystery","Sci-Fi & Fantasy"],"overview":"Light Yagami is an ace student with great prospects—and he’s bored out of his mind. But all that changes when he finds the Death Note, a notebook dropped by a rogue Shinigami death god. Any human whose name is written in the notebook dies, and Light has vowed to use the power of the Death Note to rid the world of evil. But will Light succeed in his noble goal, or will the Death Note turn him into the very thing he fights against?","episodeRuntime":22,"episodes":37},{"id":"show-31910","type":"show","title":"Naruto Shippuden","year":2007,"addedAt":"2017-12-31","releaseDate":"2007-02-15","poster":"posters/show-31910.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"After 2 and a half years Naruto finally returns to his village of Konoha, and sets about putting his ambitions to work. It will not be easy though as he has amassed a few more dangerous enemies, in the likes of the shinobi organization; Akatsuki.","episodeRuntime":25,"episodes":500},{"id":"show-78102","type":"show","title":"Steins;Gate 0","year":2018,"addedAt":"2018-04-26","releaseDate":"2018-04-12","poster":"posters/show-78102.jpg","genres":["Sci-Fi & Fantasy","Animation","Drama"],"overview":"Eccentric Rintaro falls into a depression after failing to save Kurisu, but then a neuroscientist offers him the chance to interact with an AI copy.","episodeRuntime":23,"episodes":23},{"id":"show-1668","type":"show","title":"Friends","year":1994,"addedAt":"2018-04-26","releaseDate":"1994-09-22","poster":"posters/show-1668.jpg","genres":["Comedy"],"overview":"Six young people from New York City, on their own and struggling to survive in the real world, find the companionship, comfort and support they get from each other to be the perfect antidote to the pressures of life.","episodes":228},{"id":"show-1408","type":"show","title":"House","year":2004,"addedAt":"2018-04-26","releaseDate":"2004-11-16","poster":"posters/show-1408.jpg","genres":["Drama"],"overview":"Dr. Gregory House, a drug-addicted, unconventional, misanthropic medical genius, leads a team of diagnosticians at the fictional Princeton–Plainsboro Teaching Hospital in New Jersey.","episodeRuntime":44,"episodes":176},{"id":"show-1396","type":"show","title":"Breaking Bad","year":2008,"addedAt":"2018-04-26","releaseDate":"2008-01-20","poster":"posters/show-1396.jpg","genres":["Drama","Crime"],"overview":"Walter White, a New Mexico chemistry teacher, is diagnosed with Stage III cancer and given a prognosis of only two years left to live. He becomes filled with a sense of fearlessness and an unrelenting desire to secure his family's financial future at any cost as he enters the dangerous world of drugs and crime.","episodes":62},{"id":"show-63926","type":"show","title":"One-Punch Man","year":2015,"addedAt":"2018-04-26","releaseDate":"2015-10-05","poster":"posters/show-63926.jpg","genres":["Animation","Comedy","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Saitama is a hero who only became a hero for fun. After three years of “special” training, though, he’s become so strong that he’s practically invincible. In fact, he’s too strong—even his mightiest opponents are taken out with a single punch, and it turns out that being devastatingly powerful is actually kind of a bore. With his passion for being a hero lost along with his hair, yet still faced with new enemies every day, how much longer can he keep it going?","episodeRuntime":24,"episodes":36},{"id":"show-71383","type":"show","title":"The Crossing","year":2018,"addedAt":"2018-04-29","releaseDate":"2018-04-02","poster":"posters/show-71383.jpg","genres":["Sci-Fi & Fantasy","Action & Adventure"],"overview":"Refugees from a war-torn country start showing up to seek asylum in an American town. Only the country these people are from is America and the war they are fleeing is 250 years in the future. The local sheriff with a past, a federal agent and a mother in search of her missing refugee daughter drive this allegory with a surprising conspiracy at the center.","episodeRuntime":44,"episodes":11},{"id":"show-62425","type":"show","title":"Dark Matter","year":2015,"addedAt":"2018-05-28","releaseDate":"2015-06-12","poster":"posters/show-62425.jpg","genres":["Sci-Fi & Fantasy","Drama"],"overview":"The six-person crew of a derelict spaceship awakens from stasis in the farthest reaches of space. Their memories wiped clean, they have no recollection of who they are or how they got on board. The only clue to their identities is a cargo bay full of weaponry and a destination: a remote mining colony that is about to become a war zone. With no idea whose side they are on, they face a deadly decision. Will these amnesiacs turn their backs on history, or will their pasts catch up with them?","episodeRuntime":43,"episodes":39},{"id":"show-79696","type":"show","title":"Manifest","year":2018,"addedAt":"2018-10-03","releaseDate":"2018-09-24","poster":"posters/show-79696.jpg","genres":["Sci-Fi & Fantasy","Mystery","Drama"],"overview":"After landing from a turbulent but routine flight, the crew and passengers of Montego Air Flight 828 discover five years have passed in what seemed like a few hours. As their new realities become clear, a deeper mystery unfolds and some of the returned passengers soon realize they may be meant for something greater than they ever thought possible.","episodeRuntime":42,"episodes":62},{"id":"show-1429","type":"show","title":"Attack on Titan","year":2013,"addedAt":"2018-10-08","releaseDate":"2013-04-07","poster":"posters/show-1429.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure"],"overview":"100 years ago, the last remnants of humanity were forced to retreat behind the towering walls of a fortified city to escape the massive, man-eating Titans that roamed the land outside their fortress. Only the members of the Scouting Legion dared to stray beyond the safety of the walls – but even those brave warriors seldom returned alive. Those within the city clung to the illusion of a peaceful existence until the day that dream was shattered, and their slim chance at survival was reduced to one horrifying choice: kill – or be devoured!","episodes":87},{"id":"show-60743","type":"show","title":"Constantine","year":2014,"addedAt":"2018-10-27","releaseDate":"2014-10-24","poster":"posters/show-60743.jpg","genres":["Action & Adventure","Drama","Sci-Fi & Fantasy"],"overview":"A man struggling with his faith is haunted by the sins of his past but is suddenly thrust into the role of defending humanity from the gathering forces of darkness.","episodeRuntime":43,"episodes":13},{"id":"show-73375","type":"show","title":"Tom Clancy's Jack Ryan","year":2018,"addedAt":"2018-10-27","releaseDate":"2018-08-30","poster":"posters/show-73375.jpg","genres":["Action & Adventure","Drama"],"overview":"When CIA analyst Jack Ryan stumbles upon a suspicious series of bank transfers his search for answers pulls him from the safety of his desk job and catapults him into a deadly game of cat and mouse throughout Europe and the Middle East, with a rising terrorist figurehead preparing for a massive attack against the US and her allies.","episodes":30},{"id":"show-82684","type":"show","title":"That Time I Got Reincarnated as a Slime","year":2018,"addedAt":"2018-11-18","releaseDate":"2018-10-02","poster":"posters/show-82684.jpg","genres":["Action & Adventure","Animation","Sci-Fi & Fantasy","Comedy"],"overview":"Corporate worker Mikami Satoru i seDate":"2019-01-09","poster":"posters/show-83095.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Drama"],"overview":"Iwatani Naofumi, a run-of-the-mill otaku, finds a book in the library that summons him to another world. He is tasked with joining the sword, spear, and bow as one of the Four Cardinal Heroes and fighting the Waves of Catastrophe as the Shield Hero. Excited by the prospect of a grand adventure, Naofumi sets off with his party. However, merely a few days later, he is betrayed and loses all his money, dignity, and respect. Unable to trust anyone anymore, he employs a slave named Raphtalia and takes on the Waves and the world. But will he really find a way to overturn this desperate situation?","episodeRuntime":24,"episodes":62},{"id":"show-71194","type":"show","title":"The King's Avatar","year":2017,"addedAt":"2019-01-17","releaseDate":"2017-04-07","poster":"posters/show-71194.jpg","genres":["Animation","Action & Adventure"],"overview":"In the multiplayer online game Glory, Ye Xiu is regarded as a textbook and a top-tier pro-player. However, due to a myriad of reasons, he is kicked from the team. After leaving the pro scene, he finds work in an Internet Cafe as a manager. When Glory launches its tenth server, he throws himself in to the game once more. Possessing ten years of experience, the memories of his past, and an incomplete, self-made weapon, his return along the road to the summit begins!","episodeRuntime":20,"episodes":41},{"id":"show-75208","type":"show","title":"Devilman Crybaby","year":2018,"addedAt":"2019-02-03","releaseDate":"2018-01-05","poster":"posters/show-75208.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"With demons reawakened and humanity in turmoil, a sensitive demon-boy is led into a brutal, degenerate war against evil by his mysterious friend, Ryo.","episodeRuntime":25,"episodes":10},{"id":"show-83097","type":"show","title":"The Promised Neverland","year":2019,"addedAt":"201 ttack him?","episodeRuntime":24,"episodes":11},{"id":"show-93149","type":"show","title":"Plunderer","year":2020,"addedAt":"2020-01-16","releaseDate":"2020-01-09","poster":"posters/show-93149.jpg","genres":["Action & Adventure","Sci-Fi & Fantasy","Animation"],"overview":"In a post-apocalyptic world dominated by the so-called \\"Numbers,\\" each human will have their identity branded with their own \\"Count,\\" which could define any number related to their life. May it be one's walked distance or amount of compliments given to them by others, this Count could lead them to the abyss when it has dropped to zero. In the year 305 of the Alcian calendar, Hina has inherited a mission from her Mother, whose Count has depreciated to zero, to search for the Legendary Red Baron. In her adventure, she meets a half-masked swordsman named Licht who tries to hide his identity, as he is known as a degenerate for having an incredibly low Count.","episodeRuntime":23,"episodes":24},{"id":"show-96402","type":"show","title":"Bofuri: I Don't Want to Get Hurt, so I'll Max Out My Defense","year":2020,"addedAt":"2020-01-17","releaseDate":"2020-01-08","poster":"posters/show-96402.jpg","genres":["Animation","Action & Adventure","Comedy","Sci-Fi & Fantasy"],"overview":"Kaede Honjou is invited by her friend Risa Shiramine to play a virtual reality MMO game with her. While Kaede doesn't dislike games, what she really, truly dislikes is being in pain. She creates a character named Maple, and decides to put all her points in VIT to minimize pain. As a result, she moves slowly, can't use magic, and even a rabbit can get the best of her. But as it turns out, she acquires a skill known as \\"Absolute Defense\\" as a result of her pumping points into VIT, as well as a \\"Counter Skill\\" that works against special moves. Now, with her ability to nullify all damage, she goes on adventures.","episodeRuntime":24,"episodes":24},{"id":"show-72739","type":"show","title":"Inside Edge","year":2017,"addedAt":" n the sticks. He soon despairs at his lack of succession rights and knowledge to navigate the political world, but finds hope in his aptitude for magic. This is the story of that young man earning his keep and his freedom through magic, with no world saving involved, and spending quite a while escaping his solitude. Ultimately, it is also the story of him being unable to escape the shackles of society.","episodeRuntime":24,"episodes":12},{"id":"show-30981","type":"show","title":"Monster","year":2004,"addedAt":"2020-05-10","releaseDate":"2004-04-07","poster":"posters/show-30981.jpg","genres":["Animation","Drama","Mystery","Crime"],"overview":"Kenzou Tenma, a Japanese brain surgeon in Germany, finds his life in utter turmoil after getting involved with a psychopath that was once a former patient.","episodeRuntime":24,"episodes":74},{"id":"show-890","type":"show","title":"Neon Genesis Evangelion","year":1995,"addedAt":"2020-06-05","releaseDate":"1995-10-04","poster":"posters/show-890.jpg","genres":["Sci-Fi & Fantasy","Animation","Drama"],"overview":"At the turn of the century, the Angels returned to Earth, seeking to wipe out humanity in an apocalyptic fury. Devastated, mankind's last remnants moved underground to wait for the day when the Angels would come back to finish the job. Fifteen years later, that day has come... but this time, humanity is ready to fight back with terrifying bio-mechanical weapons known as the Evangelions. Watch as Shinji, Rei, Asuka and the rest of the mysterious shadow agency Nerv battle to save earth from total annihilation.","episodeRuntime":25,"episodes":26},{"id":"show-65942","type":"show","title":"Re: ZERO, Starting Life in Another World","year":2016,"addedAt":"2020-06-05","releaseDate":"2016-04-04","poster":"posters/show-65942.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Natsuki Subaru, an ordinary high school  student, is on his way home from the convenience store when he finds  himself transported to another world. As he's lost and confused in a new  world where he doesn't even know left from right, the only person to  reach out to him was a beautiful girl with silver hair. Determined to  repay her somehow for saving him from his own despair, Subaru agrees to  help the girl find something she's looking for.","episodeRuntime":25,"episodes":85},{"id":"show-84666","type":"show","title":"WATATEN!: an Angel Flew Down to Me","year":2019,"addedAt":"2020-06-21","releaseDate":"2019-01-08","poster":"posters/show-84666.jpg","genres":["Animation","Comedy"],"overview":"Miyako is a shy college student who is also an otaku. One day she happens to meet some angelic grade school kids! When Miyako sees her little sister's new friend Hana-chan, Miyako's heart won't stop racing! Miyako tries to get along with them but struggles... A sketch comedy all about trying to get along with the super cute girl is about to begin!","episodeRuntime":24,"episodes":12},{"id":"show-61223","type":"show","title":"Akame ga Kill!","year":2014,"addedAt":"2020-06-26","releaseDate":"2014-07-07","poster":"posters/show-61223.jpg","genres":["Animation","Drama","Action & Adventure"],"overview":"Young Tatsumi travels to the capital of the Empire in order to earn money for his starving people and encounters a world of unimaginable depravity, dominated by the ruthless Prime Minister who controls the child Emperor. Tatsumi is recruited by Night Raid, a group of assassins dedicated to eliminating corruption by mercilessly killing officials and privileged nobles.","episodeRuntime":24,"episodes":24},{"id":"show-88046","type":"show","title":"Fire Force","year":2019,"addedAt":"2020-07-01","releaseDate":"2019-07-05","poster":"posters/show-88046.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Comedy"],"overview":"Year 198 of the Solar Era in Tokyo, special fire brigades are fighting against a phenomenon called spontaneous human combustion where humans beings are turned into living infernos called \\"Infernals\\". While the Infernals are first generation cases of spontaneous human combustion, later generations possess the ability to manipulate flames while retaining human form. Shinra Kusakabe, a youth who gained the nickname Devil's Footprints for his ability to ignite his feet at will, joins the Special Fire Force Company 8 which composes of other flames users as they work to extinguish any Infernals they encounter. As a faction that is creating Infernals appears, Shira begins to uncover the truth behind a mysterious fire that caused the death of his family twelve years ago.","episodeRuntime":24,"episodes":73},{"id":"show-99778","type":"show","title":"The God of High School","year":2020,"addedAt":"2020-07-05","releaseDate":"2020-07-06","poster":"posters/show-99778.jpg","genres":["Animation","Comedy","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Jin Mori has proclaimed himself the strongest high schooler. His life changes when he's invited to participate in \\"God of High School,\\" a tournament to determine the strongest high schooler of all. He's told that if he wins, any wish he makes will be granted... All the participants are powerful contenders who fight their hardest for their own wishes. What awaits them at the end of the tournament? A chaotic battle between unbelievably strong high school students is about to begin!","episodeRuntime":24,"episodes":13},{"id":"show-97617","type":"show","title":"The Misfit of Demon King Academy","year":2020,"addedAt":"2020-07-07","releaseDate":"2020-07-04","poster":"posters/show-97617.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Anos Voldigord was a tyrannical Demon King that eradicated humans, spirits, and even the gods, but became bored of eternal warfare and reincarnated with dreams of a peaceful world. However, what awaited him in reincarnation after 2000 years were descendants who became too weak after being accustomed to peace, and all sorts of magic that deteriorated to the extreme. Anos enters Demon King Academy that gathers and educates those who are viewed as the reincarnation of the Demon King, but the academy could not see through his true powers and ends up branding him as a misfit.","episodeRuntime":24,"episodes":37},{"id":"show-92588","type":"show","title":"Deca-Dence","year":2020,"addedAt":"2020-07-15","releaseDate":"2020-07-08","poster":"posters/show-92588.jpg","genres":["Animation","Drama","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Many years have passed since humanity was driven to the brink of extinction by the sudden emergence of the unknown life forms Gadoll. Those humans that survived now dwell in a 3000m-high mobile fortress Deca-dence built to protect themselves from the Gadoll threat. Denizens of Deca-dence fall into two categories: Gears, warriors who fight the Gadoll daily, and Tankers, those without the skills to fight. One day, Natsume, a Tanker girl who dreams of becoming a Gear meets surly Kaburagi, an armor repairman of Deca-dence. This chance meeting between the seemingly two opposites, the girl with a positive attitude who never gives up on her dreams and the realist who has given up on his, will eventually shake the future course of this world.","episodeRuntime":24,"episodes":12},{"id":"show-96316","type":"show","title":"Rent-a-Girlfriend","year":2020,"addedAt":"2020-07-16","releaseDate":"2020-07-11","poster":"posters/show-96316.jpg","genres":["Animation","Comedy"],"overview":"Kinoshita Kazuya is a 20-year-old failure of a college student. He managed to kiss his girlfriend once, but was dumped after a month. Completely spiteful, Kazuya uses a certain method to date a girl. He goes to their meeting place and a beautiful girl brushing her long, black hair behind her ear was there, smiling at him. Her name was Mizuhara Chizuru. Something real is born after just a single rental! A reckless rom-com filled with love and excitement is about to begin!","episodeRuntime":25,"episodes":60},{"id":"show-99779","type":"show","title":"Noblesse","year":2020,"addedAt":"2020-10-07","releaseDate":"2020-10-08","poster":"posters/show-99779.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy","Comedy"],"overview":"Rai wakes up from 820-years long sleep and starts his new life as a student in a high school founded by his loyal servant, Frankenstein. But his peaceful days with other human students are soon interrupted by mysterious attackers known as the \\"Unions\\".","episodeRuntime":24,"episodes":13},{"id":"show-95479","type":"show","title":"JUJUTSU KAISEN","year":2020,"addedAt":"2020-10-10","releaseDate":"2020-10-03","poster":"posters/show-95479.jpg","genres":["Animation","Sci-Fi & Fantasy","Action & Adventure"],"overview":"Yuji Itadori is a boy with tremendous physical strength, though he lives a completely ordinary high school life. One day, to save a classmate who has been attacked by curses, he eats the finger of Ryomen Sukuna, taking the curse into his own soul. From then on, he shares one body with Ryomen Sukuna. Guided by the most powerful of sorcerers, Satoru Gojo, Itadori is admitted to Tokyo Jujutsu High School, an organization that fights the curses... and thus begins the heroic tale of a boy who became a curse to exorcise a curse, a life from which he could never turn back.","episodeRuntime":24,"episodes":59},{"id":"show-100988","type":"show","title":"Higurashi: When They Cry","year":2020,"addedAt":"2020-10-12","releaseDate":"2020-10-01","poster":"posters/show-100988.jpg","genres":["Animation","Mystery","Sci-Fi & Fantasy","Drama"],"overview":"New kid Keiichi Maebara is settling into his new home of peaceful Hinamizawa village. Making quick friends with the girls from his school, he's arrived in time for the big festival of the year. But something about this isolated town seems \\"off,\\" and his feelings of dread continue to grow. With a gnawing fear that he's right, what dark secrets could this small community be hiding?","episodeRuntime":24,"episodes":39},{"id":"show-76479","type":"show","title":"The Boys","year":2019,"addedAt":"2020-10-17","releaseDate":"2019-07-25","poster":"posters/show-76479.jpg","genres":["Sci-Fi & Fantasy","Action & Adventure"],"overview":"A group of vigilantes known informally as “The Boys” set out to take down corrupt superheroes with no more than blue-collar grit and a willingness to fight dirty.","episodes":40},{"id":"show-111188","type":"show","title":"Scam 1992 - The Harshad Mehta Story","year":2020,"addedAt":"2020-10-30","releaseDate":"2020-10-09","poster":"posters/show-111188.jpg","genres":["Crime","Drama"],"overview":"Set in 1980's & 90's Bombay, Scam 1992 follows the life of Harshad Mehta - a stockbroker who single-handedly took the stock market to dizzying heights & his catastrophic downfall. Being directed by National Award-winning filmmaker Hansal Mehta, the series is based on journalist Debashis Basu & Sucheta Dalal's book \\"The Scam\\".","episodeRuntime":55,"episodes":10},{"id":"show-100436","type":"show","title":"Akudama Drive","year":2020,"addedAt":"2020-11-01","releaseDate":"2020-10-08","poster":"posters/show-100436.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy","Crime"],"overview":"Many years ago, a Great Civil War ravaged Japan, leaving the country fragmented between two regions: Kansai and Kanto. In Kansai, a group of six Akudama carry out missions given to them by a mysterious black cat, while evading the police. But a dangerous journey is about to unfold when a civilian girl becomes twisted into the Akudama's way of life and witnesses their criminal drives.","episodeRuntime":24,"episodes":12},{"id":"show-100281","type":"show","title":"Moriarty the Patriot","year":2020,"addedAt":"2020-11-02","releaseDate":"2020-10-11","poster":"posters/show-100281.jpg","genres":["Animation","Mystery"],"overview":"In the late 19th century, the British Empire nobility reigns while its working class suffers at their hands. Sympathetic to their plight, William James Moriarty wants to topple it all. Frustrated by the systemic inequity, Moriarty strategizes to fix the entire nation. Not even consulting detective Sherlock Holmes can stand in his way. It’s time for crime to revolutionize the world!","episodeRuntime":24,"episodes":24},{"id":"show-100612","type":"show","title":"Special Ops (2020)","year":2020,"addedAt":"2020-11-08","releaseDate":"2020-03-17","poster":"posters/show-100612.jpg","genres":["Mystery","Drama","Crime"],"overview":"The series follows Himmat Singh of Research and Analysis Wing who draws similar patterns in terrorist attacks and is convinced a single person is behind all the attacks. His task force team of five agents living in various parts of the world aim to catch the mastermind. The story is based on an inspiration taken from nineteen years worth of national significant events.","episodes":15},{"id":"show-85271","type":"show","title":"WandaVision","year":2021,"addedAt":"2021-01-20","releaseDate":"2021-01-15","poster":"posters/show-85271.jpg","genres":["Sci-Fi & Fantasy","Mystery","Drama"],"overview":"Wanda Maximoff and Vision—two super-powered beings living idealized suburban lives—begin to suspect that everything is not as it seems.","episodes":9},{"id":"show-114796","type":"show","title":"Tandav","year":2021,"addedAt":"2021-01-20","releaseDate":"2021-01-14","poster":"posters/show-114796.jpg","genres":["Drama","Crime","Mystery"],"overview":"Tandav is the coming together of different worlds under the gamut of politics. It is a dramatic take of the powerplay between people at the highest level where they get overthrown by others to secure their position. Young and upcoming student politicians are also featured and we get to see where their future is headed in this dark abyss of politics.","episodeRuntime":38,"episodes":9},{"id":"show-94664","type":"show","title":"Mushoku Tensei: Jobless Reincarnation","year":2021,"addedAt":"2021-01-24","releaseDate":"2021-01-11","poster":"posters/sho ty, they are piloted by the Eighty-sixers—those considered to be less than human and treated as mere tools. Determined to achieve his own mysterious ends, Shin, the captain of Spearhead Squadron, which is comprised of Eighty-sixers, continues to fight a hopeless war on a battlefield where only death awaits him.","episodeRuntime":24,"episodes":23},{"id":"show-97525","type":"show","title":"To Your Eternity","year":2021,"addedAt":"2021-05-05","releaseDate":"2021-04-12","poster":"posters/show-97525.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"An immortal being takes on the form of a human boy, wandering the earth and experiencing the pains and joys of life throughout his story without end.","episodeRuntime":25,"episodes":62},{"id":"show-84958","type":"show","title":"Loki","year":2021,"addedAt":"2021-06-09","releaseDate":"2021-06-09","poster":"posters/show-84958.jpg","genres":["Drama","Sci-Fi & Fantasy"],"overview":"After stealing the Tesseract during the events of “Avengers: Endgame,” an alternate version of Loki is brought to the mysterious Time Variance Authority, a bureaucratic organization that exists outside of time and space and monitors the timeline. They give Loki a choice: face being erased from existence due to being a “time variant” or help fix the timeline and stop a greater threat.","episodes":12},{"id":"show-93405","type":"show","title":"Squid Game","year":2021,"addedAt":"2021-11-10","releaseDate":"2021-09-17","poster":"posters/show-93405.jpg","genres":["Action & Adventure","Mystery","Drama"],"overview":"Hundreds of cash-strapped players accept a strange invitation to compete in children's games. Inside, a tempting prize awaits — with deadly high stakes.","episodes":22},{"id":"show-94605","type":"show","title":"Arcane","year":2021,"addedAt":"2021-11-19","releaseDate":"2021-11-06","poster":"posters/show-94605.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Amid the stark discord of twin cities Piltover and Zaun, two sisters fight on rival sides of a war between magic technologies and clashing convictions.","episodes":18},{"id":"movie-512195","type":"movie","title":"Red Notice","year":2021,"addedAt":"2021-11-19","releaseDate":"2021-11-04","poster":"posters/movie-512195.jpg","genres":["Action","Comedy","Crime"],"overview":"An Interpol-issued Red Notice is a global alert to hunt and capture the world's most wanted. But when a daring heist brings together the FBI's top profiler and two rival criminals, there's no telling what will happen.","runtimeMinutes":118},{"id":"show-88329","type":"show","title":"Hawkeye (2021)","year":2021,"addedAt":"2021-12-13","releaseDate":"2021-11-24","poster":"posters/show-88329.jpg","genres":["Drama","Comedy","Action & Adventure"],"overview":"Former Avenger Clint Barton has a seemingly simple mission: get back to his family for Christmas. Possible? Maybe with the help of Kate Bishop, a 22-year-old archer with dreams of becoming a superhero. The two are forced to work together when a presence from Barton’s past threatens to derail far more than the festive spirit.","episodes":6},{"id":"show-121787","type":"show","title":"Takt op.Destiny","year":2021,"addedAt":"2021-12-13","releaseDate":"2021-10-06","poster":"posters/show-121787.jpg","genres":["Animation","Action & Adventure","Sci-Fi & Fantasy"],"overview":"Music is the light that illuminates people's hearts-- and that \\"light\\" was suddenly taken from the world. The world changed the night the black \\"Kuroya Meteorite\\" fell. Grotesque monsters known as D2 emerged from the meteorite and began to overrun the land and people. As the D2 were drawn to melodies people played, eventually \\"music\\" itself became taboo. However, those who opposed the monsters appeared. They the \\"Musicart,\\" girls who draw power from music. They possess the great operas and musical scores of humanity history and use them to defeat the D2.","episodeRuntime":24,"episodes":12},{"id":"show-118821", e-camera ensemble comedy following the lives of an eclectic group of detectives in a New York precinct, including one slacker who is forced to shape up when he gets a new boss.","episodes":152},{"id":"show-46533","type":"show","title":"The Americans (2013)","year":2013,"addedAt":"2023-03-25","releaseDate":"2013-01-30","poster":"posters/show-46533.jpg","genres":["Crime","Drama"],"overview":"Set during the Cold War period in the 1980s, The Americans is the story of Elizabeth and Philip Jennings, two Soviet KGB officers posing as an American married couple in the suburbs of Washington D.C. and their neighbor, Stan Beeman, an FBI Counterintelligence agent.","episodes":75},{"id":"show-46616","type":"show","title":"The Returned","year":2012,"addedAt":"2023-03-25","releaseDate":"2012-11-26","poster":"posters/show-46616.jpg","genres":["Mystery","Sci-Fi & Fantasy","Drama"],"overview":"In the shadow of an enormous hydraulic dam, the lives of the residents of a small French town are changed to their core when hundreds of previously dead relatives all return home on the same day.","episodeRuntime":55,"episodes":16},{"id":"show-46619","type":"show","title":"Rectify","year":2013,"addedAt":"2023-03-25","releaseDate":"2013-04-22","poster":"posters/show-46619.jpg","genres":["Crime","Drama"],"overview":"After 19 years on Death Row for the rape and murder of his teenage girlfriend, Daniel Holden is going home. His conviction has been vacated due to new DNA evidence. Now he has to return to a world he no longer knows and his reentry into the outside world may be as unforgiving as prison. Daniel is haunted by the past, dogged by the present, and uncertain of the future. As he struggles to adapt to his new life, his homecoming reignites the fears of a small town and threatens to shatter his family’s fragile peace. Daniel’s alleged crime divided a community. Will his freedom tear it in half?","episodeRuntime":60,"episodes":30},{"id":"show-46511","type":"show","title":"Utopia","year":2013, her, this unlikely trio must team up and learn to work in concert to save the universe.","runtimeMinutes":105},{"id":"movie-198375","type":"movie","title":"The Garden of Words","year":2013,"addedAt":"2025-05-04","releaseDate":"2013-05-31","poster":"posters/movie-198375.jpg","genres":["Animation","Drama","Romance"],"overview":"Takao, who is training to become a shoemaker, skipped school and is sketching shoes in a Japanese-style garden. He meets a mysterious woman, Yukino, who is older than him. Then, without arranging the times, the two start to see each other again and again, but only on rainy days. They deepen their relationship and open up to each other. But the end of the rainy season soon approaches.","runtimeMinutes":46},{"id":"show-82739","type":"show","title":"Rascal Does Not Dream of Bunny Girl Senpai","year":2018,"addedAt":"2025-05-04","releaseDate":"2018-10-04","poster":"posters/show-82739.jpg","genres":["Animation","Comedy","Drama"],"overview":"Puberty Syndrome—a rumored, mysterious syndrome that only affects those in their puberty. For example, a bunny girl suddenly appeared in front of Sakuta Azusagawa. The bunny girl's real identity is Mai Sakurajima, a teenage celebrity who is currently an inactive high school senior. For some reason, her charming figure does not reflect in the eyes of others. In the course of revealing the mystery behind this phenomenon, Sakuta begins to explore his feelings towards Mai. Set in a city where the skies and seas shine, Sakuta unfolds the meaning behind his bizarre encounters on women with the said syndrome.","episodeRuntime":24,"episodes":26},{"id":"show-63145","type":"show","title":"Charlotte","year":2015,"addedAt":"2025-05-04","releaseDate":"2015-07-05","poster":"posters/show-63145.jpg","genres":["Animation","Drama","Sci-Fi & Fantasy"],"overview":"All thanks to the special ability that he developed, Yuu was able to  cheat his way into a very prestigious high school. With his power, he  thought nothing was going to st id":"show-208891","type":"show","title":"Heavenly Delusion","year":2023,"addedAt":"2025-05-13","releaseDate":"2023-04-01","poster":"posters/show-208891.jpg","genres":["Animation","Mystery","Action & Adventure","Sci-Fi & Fantasy"],"overview":"In the year 2024, the world has collapsed. Grotesque monsters lurk amongst the ruins of Japan, while remaining people scrape together what they can to survive. Kiruko, an odd-job girl in Nakano, accepts a mysterious woman's dying wish to take a boy named Maru to a place called Heaven. Maru is convinced that there will be a boy there who looks exactly like him.","episodeRuntime":24,"episodes":13},{"id":"show-65945","type":"show","title":"Kabaneri of the Iron Fortress","year":2016,"addedAt":"2025-05-18","releaseDate":"2016-04-08","poster":"posters/show-65945.jpg","genres":["Animation","Drama","Action & Adventure","Sci-Fi & Fantasy"],"overview":"In the midst of an industrial revolution, the people of Hinomoto fight hordes of undead creatures, known as Kabane, using powerful armored trains.","episodeRuntime":22,"episodes":12},{"id":"movie-893712","type":"movie","title":"Sword Art Online the Movie – Progressive – Scherzo of Deep Night","year":2022,"addedAt":"2025-05-22","releaseDate":"2022-10-22","poster":"posters/movie-893712.jpg","genres":["Animation","Action","Fantasy","Science Fiction"],"overview":"Over a month has passed since 10,000 users were trapped inside the \\"Sword Art Online\\" world. Asuna, who cleared the first floor of the floating iron castle of Aincrad, joined up with Kirito and continued her journey to reach the top floor. With the support of female Information Broker Argo, clearing the floors seemed to be progressing smoothly, but conflict erupts between two major guilds who should be working together – the top player groups ALS (the Aincrad Liberation Squad) and DKB (the Dragon Knights Brigade). And meanwhile, behind the scenes exists a mysterious figure pulling the strings…","runtimeMinutes":100},{"id":"movie-761898","type":"movie","title":"Sword Art Online the Movie - Progressive - Aria of a Starless Night","year":2021,"addedAt":"2025-05-22","releaseDate":"2021-10-30","poster":"posters/movie-761898.jpg","genres":["Animation","Action","Fantasy","Science Fiction"],"overview":"Asuna Yuuki had never played online games until accidentally putting on the NerveGear for Sword Art Online, the world’s first VRMMORPG. She soon finds herself and other players trapped inside a game, where if a player dies in the game, they die in the real world. As she continues to live on in this world where death is always a step away, a solitary swordsman named Kirito appears before her.","runtimeMinutes":97},{"id":"show-76059","type":"show","title":"A Place Further Than the Universe","year":2018,"addedAt":"2025-05-23","releaseDate":"2018-01-02","poster":"posters/show-76059.jpg","genres":["Animation","Drama","Comedy"],"overview":"Scenery that we have never seen. Sounds that we have never heard. Scent that we have never smelled. Food that we have never tasted. And the surge of emotion that we have never experienced. This is the expedition of recollecting the pieces torn apart and sensation left alone. When we reach that place, what will we think? Howling, 40 degree angle. Raging, 50 degree angle. Shouting, 60 degree angle. A wilderness beyond the heavy sea. The furthest south, far from civilization. At the top of the Earth. We will find lights through the girls' eyes to live tomorrow.","episodeRuntime":24,"episodes":13},{"id":"movie-1062807","type":"movie","title":"SPY x FAMILY CODE: White","year":2023,"addedAt":"2025-05-26","releaseDate":"2023-12-22","poster":"posters/movie-1062807.jpg","genres":["Animation","Comedy","Adventure","Action"],"overview":"While under the guise of taking his family on a weekend winter getaway, Loid's attempt to make progress on his current mission Operation Strix proves difficult when Anya mistakenly gets involved and triggers events that threaten world peace.","runtimeM
